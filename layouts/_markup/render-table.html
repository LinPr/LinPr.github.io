{{- /* 表格渲染钩子：外层加滚动容器，让宽表在窄屏上横向滚动。
       注意不要把 display:block 加在 table 上，否则 thead/tbody 会各自
       独立布局，表头和表体的列宽对不齐。 */ -}}
<div class="table-scroll">
<table
	{{- range $k, $v := .Attributes }}
		{{- if $v }}
			{{- printf " %s=%q" $k ($v | transform.HTMLEscape) | safeHTMLAttr }}
		{{- end }}
	{{- end }}>
	<thead>
		{{- range .THead }}
			<tr>
				{{- range . }}
					<th
						{{- with .Alignment }}
							{{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
						{{- end -}}>
						{{- .Text -}}
					</th>
				{{- end }}
			</tr>
		{{- end }}
	</thead>
	<tbody>
		{{- range .TBody }}
			<tr>
				{{- range . }}
					<td
						{{- with .Alignment }}
							{{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
						{{- end -}}>
						{{- .Text -}}
					</td>
				{{- end }}
			</tr>
		{{- end }}
	</tbody>
</table>
</div>
