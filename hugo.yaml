baseURL: 'https://linpr.github.io/'
locale: 'zh-CN'
title: 'LinPr 的博客'
theme: 'hugo-PaperMod'
defaultContentLanguage: 'zh'

enableRobotsTXT: true
hasCJKLanguage: true
summaryLength: 70

pagination:
  pagerSize: 10

# 显式声明 taxonomies 会覆盖 Hugo 的默认值（tag / category），
# 所以这两个必须一起重新写，否则 /tags/ 会消失。
taxonomies:
  tag: tags
  category: categories
  series: series

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  title: LinPr 的博客
  description: 记录 Go、C++、Unix 系统编程与后端开发的学习笔记。
  keywords: [Golang, C++, Unix, 系统编程, 后端, 读书笔记]
  author: LinPr
  images: ["/og-image.png"]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: true
  tocopen: true
  hidemeta: false
  hideSummary: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  # giscus：评论存到本仓库的 GitHub Discussions，ID 由 giscus.app 生成
  giscus:
    repo: LinPr/LinPr.github.io
    repoID: R_kgDOLPRJrQ
    category: Announcements
    categoryID: DIC_kwDOLPRJrc4DLLkH
    lang: zh-CN

  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon-16x16.png
    favicon32x32: /favicon-32x32.png
    apple_touch_icon: /apple-touch-icon.png

  label:
    text: "LinPr"
    icon: /images/avatar-96.png
    iconHeight: 34

  # 摄影板块：图片在阿里云 OSS（bucket linpr-github-io，目录 photography/），
  # 页面用 OSS 图片处理参数实时生成缩略图和大图。上传用 tools/photos/upload.sh
  photography:
    baseURL: "https://linpr-github-io.oss-cn-hangzhou.aliyuncs.com/photography/"
    thumb: "?x-oss-process=image/resize,w_900/quality,q_82/format,webp"
    large: "?x-oss-process=image/resize,w_2400,limit_1/quality,q_88/format,webp"

  homeInfoParams:
    Title: "Hi, I'm LinPr"
    Content: |
      技术爱好者，摄影爱好者。

  socialIcons:
    - name: github
      url: "https://github.com/LinPr"

  editPost:
    URL: "https://github.com/LinPr/LinPr.github.io/edit/main/content"
    Text: "编辑本文"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      pre: '<svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>'
      name: 归档
      url: /archives/
      weight: 10
    - identifier: categories
      pre: '<svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
      name: 分类
      url: /categories/
      weight: 20
    - identifier: series
      pre: '<svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5" opacity=".55"/></svg>'
      name: 系列
      url: /series/
      weight: 25
    - identifier: photography
      pre: '<svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7.5 6.5H5a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-2.5z"/><circle cx="12" cy="13" r="3.5"/></svg>'
      name: 摄影
      url: /photography/
      weight: 30
    - identifier: search
      pre: '<svg class="menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
      name: 搜索
      url: /search/
      weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
