<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 706" width="1000" height="706" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<rect width="1000" height="706" fill="#ffffff"/>
<text x="500.0" y="36.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">CSI 驱动在集群里的通用形态：两个工作负载，一组 unix socket</text>
<text x="500.0" y="62.0" font-size="12.5" fill="#64748b" text-anchor="middle">任意 CSI 驱动都遵循这套分工：controller 侧只部署一份，node 侧每个节点各一份</text>
<text x="500.0" y="78.0" font-size="12" fill="#64748b" text-anchor="middle">驱动本身不 watch 任何对象，它只是被 sidecar 和 kubelet 调用的 gRPC 服务端</text>
<rect x="250.0" y="90.0" width="500.0" height="100.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="264.0" y="114.0" font-size="13.5" fill="#475569" text-anchor="start" font-weight="700">kube-apiserver</text>
<rect x="264.0" y="124.0" width="158.6" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="343.3" y="140.0" font-size="11" fill="#475569" text-anchor="middle">PersistentVolumeClaim</text>
<rect x="430.6" y="124.0" width="125.6" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="493.4" y="140.0" font-size="11" fill="#475569" text-anchor="middle">PersistentVolume</text>
<rect x="564.2" y="124.0" width="125.6" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="627.0" y="140.0" font-size="11" fill="#475569" text-anchor="middle">VolumeAttachment</text>
<rect x="264.0" y="154.0" width="112.4" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="320.2" y="170.0" font-size="11" fill="#475569" text-anchor="middle">VolumeSnapshot</text>
<rect x="384.4" y="154.0" width="145.4" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="457.1" y="170.0" font-size="11" fill="#475569" text-anchor="middle">CSIDriver / CSINode</text>
<rect x="36.0" y="240.0" width="450.0" height="240.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="52.0" y="266.0" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="700">controller 侧（Deployment，通常 1 副本）</text>
<text x="52.0" y="298.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">external-provisioner</text>
<text x="52.0" y="314.0" font-size="11.0" fill="#64748b" text-anchor="start">watch PVC → CreateVolume / DeleteVolume</text>
<text x="52.0" y="331.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">external-attacher</text>
<text x="52.0" y="347.0" font-size="11.0" fill="#64748b" text-anchor="start">watch VolumeAttachment → ControllerPublish</text>
<text x="52.0" y="364.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">external-snapshotter</text>
<text x="52.0" y="380.0" font-size="11.0" fill="#64748b" text-anchor="start">watch VolumeSnapshot → CreateSnapshot</text>
<text x="52.0" y="397.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">external-resizer</text>
<text x="52.0" y="413.0" font-size="11.0" fill="#64748b" text-anchor="start">PVC 容量变化 → ControllerExpandVolume</text>
<rect x="52.0" y="436.0" width="418.0" height="34.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="64.0" y="458.0" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">驱动：Controller 服务（同一个 unix socket）</text>
<rect x="530.0" y="240.0" width="434.0" height="240.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="546.0" y="266.0" font-size="13.5" fill="#059669" text-anchor="start" font-weight="700">node 侧（每个节点一个 DaemonSet）</text>
<text x="546.0" y="298.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">kubelet</text>
<text x="546.0" y="314.0" font-size="11.0" fill="#64748b" text-anchor="start">NodeStage / NodePublish / NodeGetVolumeStats</text>
<text x="546.0" y="331.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">node-driver-registrar</text>
<text x="546.0" y="347.0" font-size="11.0" fill="#64748b" text-anchor="start">把驱动 socket 注册到 kubelet 的插件目录</text>
<text x="546.0" y="364.0" font-size="12.0" fill="#1e293b" text-anchor="start" font-weight="700">liveness-probe</text>
<text x="546.0" y="380.0" font-size="11.0" fill="#64748b" text-anchor="start">定期调 Probe，失败就重启驱动容器</text>
<rect x="546.0" y="426.0" width="402.0" height="38.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="558.0" y="450.0" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">驱动：Node 服务 + Identity 服务（同一个 unix socket）</text>
<rect x="300.0" y="560.0" width="400.0" height="92.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="316.0" y="584.0" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700">后端存储（由驱动决定）</text>
<text x="316.0" y="606.0" font-size="11.5" fill="#1e293b" text-anchor="start">块设备、分布式文件系统、对象存储、本地磁盘……</text>
<text x="316.0" y="626.0" font-size="11.5" fill="#64748b" text-anchor="start">驱动把 CSI 的语义翻译成对后端的实际操作</text>
<text x="316.0" y="644.0" font-size="11.5" fill="#64748b" text-anchor="start">hostpath 的后端只是宿主机上的一个目录</text>
<path d="M250.0,150.0 L90.0,150.0 L90.0,239.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="98.0" y="142.0" font-size="11.5" fill="#64748b" text-anchor="start">watch</text>
<path d="M750.0,176.0 L960.0,176.0 L960.0,239.0" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="768.0" y="168.0" font-size="11.5" fill="#059669" text-anchor="start">Pod spec、卷信息</text>
<path d="M261.0,430.0 L261.0,435.0" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="269.0" y="442.0" font-size="11.5" fill="#2563eb" text-anchor="start">gRPC</text>
<path d="M747.0,418.0 L747.0,425.0" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="755.0" y="430.0" font-size="11.5" fill="#059669" text-anchor="start">gRPC</text>
<path d="M191.0,481.0 L191.0,559.0" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="185.0" y="500.0" font-size="11" fill="#7c3aed" text-anchor="end">建卷、快照</text>
<path d="M717.0,481.0 L717.0,559.0" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="711.0" y="500.0" font-size="11" fill="#7c3aed" text-anchor="end">挂载、读写</text>
<rect x="36.0" y="672.0" width="105.8" height="23.0" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="88.9" y="688.0" font-size="11" fill="#2563eb" text-anchor="middle">调用方 / 集群侧</text>
<rect x="151.8" y="672.0" width="64.0" height="23.0" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
<text x="183.8" y="688.0" font-size="11" fill="#7c3aed" text-anchor="middle">驱动进程</text>
<rect x="225.8" y="672.0" width="83.8" height="23.0" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="267.7" y="688.0" font-size="11" fill="#059669" text-anchor="middle">kubelet 侧</text>
<rect x="319.6" y="672.0" width="64.0" height="23.0" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="351.6" y="688.0" font-size="11" fill="#ea580c" text-anchor="middle">后端存储</text>
<rect x="393.6" y="672.0" width="64.0" height="23.0" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="425.6" y="688.0" font-size="11" fill="#475569" text-anchor="middle">集群对象</text>
</svg>