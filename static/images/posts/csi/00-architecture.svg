<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 772" width="1000" height="772" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<rect width="1000" height="772" fill="#ffffff"/>
<text x="500.0" y="36.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">CSI 驱动在集群里的通用形态：两个工作负载，一组 unix socket</text>
<text x="500.0" y="62.0" font-size="12.5" fill="#64748b" text-anchor="middle">任意 CSI 驱动都遵循这套分工；controller 侧只部署一份，node 侧每个节点各一份</text>
<text x="500.0" y="78.0" font-size="12" fill="#64748b" text-anchor="middle">驱动本身不 watch 任何对象，它只是被 sidecar 和 kubelet 调用的 gRPC 服务端</text>
<rect x="170.0" y="92.0" width="660.0" height="104.0" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="186.0" y="116.0" font-size="13.5" fill="#475569" text-anchor="start" font-weight="700">kube-apiserver</text>
<text x="310.0" y="116.0" font-size="11" fill="#64748b" text-anchor="start">驱动不直接读写这些对象</text>
<rect x="186.0" y="126.0" width="152.3" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="262.1" y="141.5" font-size="10.5" fill="#475569" text-anchor="middle">PersistentVolumeClaim</text>
<rect x="346.3" y="126.0" width="120.8" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="406.7" y="141.5" font-size="10.5" fill="#475569" text-anchor="middle">PersistentVolume</text>
<rect x="475.1" y="126.0" width="120.8" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="535.5" y="141.5" font-size="10.5" fill="#475569" text-anchor="middle">VolumeAttachment</text>
<rect x="186.0" y="158.0" width="108.2" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="240.1" y="173.5" font-size="10.5" fill="#475569" text-anchor="middle">VolumeSnapshot</text>
<rect x="302.2" y="158.0" width="139.7" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="372.0" y="173.5" font-size="10.5" fill="#475569" text-anchor="middle">CSIDriver / CSINode</text>
<rect x="449.9" y="158.0" width="95.6" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="497.7" y="173.5" font-size="10.5" fill="#475569" text-anchor="middle">StorageClass</text>
<rect x="36.0" y="232.0" width="450.0" height="330.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="56.0" y="260.0" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="700">controller 侧（Deployment，通常 1 副本）</text>
<text x="58.0" y="298.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">external-provisioner</text>
<text x="58.0" y="315.0" font-size="11" fill="#64748b" text-anchor="start">watch PVC → CreateVolume / DeleteVolume</text>
<text x="58.0" y="340.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">external-attacher</text>
<text x="58.0" y="357.0" font-size="11" fill="#64748b" text-anchor="start">watch VolumeAttachment → ControllerPublish</text>
<text x="58.0" y="382.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">external-snapshotter</text>
<text x="58.0" y="399.0" font-size="11" fill="#64748b" text-anchor="start">watch VolumeSnapshot → CreateSnapshot</text>
<text x="58.0" y="424.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">external-resizer</text>
<text x="58.0" y="441.0" font-size="11" fill="#64748b" text-anchor="start">PVC 容量变化 → ControllerExpandVolume</text>
<rect x="514.0" y="232.0" width="450.0" height="330.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="534.0" y="260.0" font-size="13.5" fill="#059669" text-anchor="start" font-weight="700">node 侧（每个节点一个 DaemonSet）</text>
<text x="536.0" y="298.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">kubelet</text>
<text x="536.0" y="315.0" font-size="11" fill="#64748b" text-anchor="start">NodeStage / NodePublish / NodeGetVolumeStats</text>
<text x="536.0" y="340.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">node-driver-registrar</text>
<text x="536.0" y="357.0" font-size="11" fill="#64748b" text-anchor="start">把 socket 注册到 kubelet 的插件目录</text>
<text x="536.0" y="382.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">liveness-probe</text>
<text x="536.0" y="399.0" font-size="11" fill="#64748b" text-anchor="start">定期 Probe，失败就重启驱动容器</text>
<text x="536.0" y="424.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">挂载点</text>
<text x="536.0" y="441.0" font-size="11" fill="#64748b" text-anchor="start">/var/lib/kubelet/pods/&lt;uid&gt;/volumes</text>
<rect x="58.0" y="476.0" width="406.0" height="62.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="74.0" y="502.0" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">驱动：Controller 服务</text>
<text x="74.0" y="522.0" font-size="11" fill="#64748b" text-anchor="start">unix socket，路径由驱动自己定</text>
<rect x="536.0" y="476.0" width="406.0" height="62.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="552.0" y="502.0" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">驱动：Node 服务 + Identity 服务</text>
<text x="552.0" y="522.0" font-size="11" fill="#64748b" text-anchor="start">unix socket，同一个进程里注册</text>
<rect x="36.0" y="606.0" width="928.0" height="88.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="56.0" y="632.0" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700">后端存储（由驱动决定）</text>
<rect x="226.0" y="616.0" width="51.5" height="23.0" rx="11.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="251.8" y="631.5" font-size="10.5" fill="#ea580c" text-anchor="middle">块设备</text>
<rect x="285.5" y="616.0" width="93.5" height="23.0" rx="11.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="332.2" y="631.5" font-size="10.5" fill="#ea580c" text-anchor="middle">分布式文件系统</text>
<rect x="387.0" y="616.0" width="62.0" height="23.0" rx="11.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="418.0" y="631.5" font-size="10.5" fill="#ea580c" text-anchor="middle">对象存储</text>
<rect x="457.0" y="616.0" width="62.0" height="23.0" rx="11.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="488.0" y="631.5" font-size="10.5" fill="#ea580c" text-anchor="middle">本地目录</text>
<text x="56.0" y="658.0" font-size="11.5" fill="#1e293b" text-anchor="start">驱动把 CreateVolume、NodePublish 这些语义翻译成对后端的实际操作</text>
<text x="56.0" y="678.0" font-size="11.5" fill="#64748b" text-anchor="start">hostpath 的后端是宿主机上的一个目录；nfs 的后端是 NFS 服务端上的一个子目录</text>
<path d="M210.0,196.0 L110.0,196.0 L110.0,231.0" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="110.0" cy="214.0" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="110.0" y="218.2" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">1</text>
<text x="126.0" y="218.0" font-size="11" fill="#64748b" text-anchor="start">watch 对象变化</text>
<path d="M830.0,176.0 L938.0,176.0 L938.0,231.0" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="838.0" y="168.0" font-size="11" fill="#059669" text-anchor="start">Pod spec</text>
<path d="M261.0,446.0 L261.0,475.0" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="237.0" cy="458.0" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="237.0" y="462.2" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">2</text>
<text x="269.0" y="462.0" font-size="11" fill="#2563eb" text-anchor="start">gRPC</text>
<path d="M739.0,446.0 L739.0,475.0" stroke="#059669" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="715.0" cy="458.0" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="715.0" y="462.2" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">3</text>
<text x="747.0" y="462.0" font-size="11" fill="#059669" text-anchor="start">gRPC</text>
<path d="M156.0,563.0 L156.0,605.0" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="140.0" cy="580.0" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="140.0" y="584.2" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">4</text>
<text x="172.0" y="584.0" font-size="11" fill="#7c3aed" text-anchor="start">建卷、扩容、快照</text>
<path d="M634.0,563.0 L634.0,605.0" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<circle cx="618.0" cy="580.0" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="618.0" y="584.2" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">4</text>
<text x="650.0" y="584.0" font-size="11" fill="#7c3aed" text-anchor="start">挂载、读写卷数据</text>
<rect x="36.0" y="722.0" width="105.8" height="23.0" rx="11.5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="88.9" y="737.5" font-size="11" fill="#2563eb" text-anchor="middle">调用方 / 集群侧</text>
<rect x="151.8" y="722.0" width="64.0" height="23.0" rx="11.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
<text x="183.8" y="737.5" font-size="11" fill="#7c3aed" text-anchor="middle">驱动进程</text>
<rect x="225.8" y="722.0" width="83.8" height="23.0" rx="11.5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="267.7" y="737.5" font-size="11" fill="#059669" text-anchor="middle">kubelet 侧</text>
<rect x="319.6" y="722.0" width="64.0" height="23.0" rx="11.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
<text x="351.6" y="737.5" font-size="11" fill="#ea580c" text-anchor="middle">后端存储</text>
<rect x="393.6" y="722.0" width="64.0" height="23.0" rx="11.5" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="425.6" y="737.5" font-size="11" fill="#475569" text-anchor="middle">集群对象</text>
<text x="964.0" y="738.0" font-size="11" fill="#64748b" text-anchor="end">① watch ② ③ gRPC ④ 操作后端</text>
</svg>