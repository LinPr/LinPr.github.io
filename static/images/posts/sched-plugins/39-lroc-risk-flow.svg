<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480.0" y="32.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">LowRiskOverCommitment 的风险合成</text>
<text x="480.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">每种资源（CPU、内存）各算一遍 totalRisk，取较大者；rank = 1 − max，score = round(100 × rank)</text>
<rect x="30.0" y="84.0" width="270.0" height="150.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<text x="165.0" y="106.0" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">PreScore（每个 Pod 一次）</text>
<text x="44.0" y="128.0" font-size="11.8" fill="#0d9488" text-anchor="start">CreatePodResourcesStateData</text>
<text x="44.0" y="146.0" font-size="11.8" fill="#334155" text-anchor="start">requests = GetResourceRequested(pod)</text>
<text x="44.0" y="164.0" font-size="11.8" fill="#334155" text-anchor="start">limits   = GetResourceLimits(pod)</text>
<text x="44.0" y="182.0" font-size="11.8" fill="#334155" text-anchor="start">SetMaxLimits：limit 至少等于 request</text>
<text x="44.0" y="200.0" font-size="11.8" fill="#334155" text-anchor="start">写入 CycleState：</text>
<text x="44.0" y="218.0" font-size="11.8" fill="#64748b" text-anchor="start">  LowRiskOverCommitment.PodResources</text>
<rect x="30.0" y="262.0" width="270.0" height="136.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="165.0" y="284.0" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">Score 入口的两道门</text>
<text x="44.0" y="306.0" font-size="11.8" fill="#334155" text-anchor="start">Pod 的 CPU/内存 request、limit 全为 0</text>
<text x="44.0" y="324.0" font-size="11.8" fill="#ea580c" text-anchor="start">（BestEffort）→ 直接 0 分</text>
<text x="44.0" y="342.0" font-size="11.8" fill="#ea580c" text-anchor="start">节点无指标 → 0 分</text>
<text x="44.0" y="360.0" font-size="11.8" fill="#64748b" text-anchor="start">CycleState 读不到 → 现场重算</text>
<rect x="340.0" y="84.0" width="290.0" height="150.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="485.0" y="106.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">GetNodeRequestsAndLimits</text>
<text x="354.0" y="128.0" font-size="11.8" fill="#334155" text-anchor="start">遍历 NodeInfo 里的 Pod + 待调度 Pod</text>
<text x="354.0" y="146.0" font-size="11.8" fill="#2563eb" text-anchor="start">R = Σrequest，L = Σlimit（含本 Pod）</text>
<text x="354.0" y="164.0" font-size="11.8" fill="#2563eb" text-anchor="start">R⁻、L⁻：不含本 Pod 的版本</text>
<text x="354.0" y="182.0" font-size="11.8" fill="#334155" text-anchor="start">R、R⁻ 被截到 ≤ C；L、L⁻ 不截</text>
<text x="354.0" y="200.0" font-size="11.8" fill="#334155" text-anchor="start">C = Allocatable</text>
<text x="354.0" y="218.0" font-size="11.8" fill="#059669" text-anchor="start">NodeInfo 含 assumed Pod，无滞后</text>
<rect x="340.0" y="262.0" width="290.0" height="136.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="485.0" y="284.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">riskLimit（limit 超卖程度）</text>
<text x="354.0" y="306.0" font-size="11.8" fill="#2563eb" text-anchor="start">L &gt; C 时：(L − C) / (L − R)</text>
<text x="354.0" y="324.0" font-size="11.8" fill="#334155" text-anchor="start">否则 0</text>
<text x="354.0" y="342.0" font-size="11.8" fill="#334155" text-anchor="start">「limit 超出容量的部分」占</text>
<text x="354.0" y="360.0" font-size="11.8" fill="#334155" text-anchor="start">「limit 超出 request 的部分」的比例</text>
<rect x="670.0" y="84.0" width="260.0" height="314.0" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="800.0" y="106.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">riskLoad（实际负载）</text>
<text x="684.0" y="128.0" font-size="11.8" fill="#334155" text-anchor="start">CreateResourceStats(零 request)</text>
<text x="684.0" y="146.0" font-size="11.8" fill="#334155" text-anchor="start">μ = 平均用量 / C</text>
<text x="684.0" y="164.0" font-size="11.8" fill="#334155" text-anchor="start">σ = 标准差 / C × √n</text>
<text x="684.0" y="182.0" font-size="11.8" fill="#64748b" text-anchor="start">  n = smoothingWindowSize（5）</text>
<text x="684.0" y="200.0" font-size="11.8" fill="#334155" text-anchor="start">σ ≤ √(0.99 · μ(1−μ))</text>
<text x="684.0" y="218.0" font-size="11.8" fill="#7c3aed" text-anchor="start">矩匹配 → Beta(α, β)</text>
<text x="684.0" y="236.0" font-size="11.8" fill="#7c3aed" text-anchor="start">allocProb = P(X ≤ R⁻/C)</text>
<text x="684.0" y="254.0" font-size="11.8" fill="#334155" text-anchor="start">若 L⁻ &lt; C 且 R⁻ ≤ L⁻：</text>
<text x="684.0" y="272.0" font-size="11.8" fill="#334155" text-anchor="start">  L⁻ = 0 → allocProb = 1</text>
<text x="684.0" y="290.0" font-size="11.8" fill="#334155" text-anchor="start">  否则 ÷ P(X ≤ L⁻/C)</text>
<text x="684.0" y="308.0" font-size="11.8" fill="#7c3aed" text-anchor="start">riskLoad = 1 − allocProb</text>
<text x="684.0" y="326.0" font-size="11.8" fill="#ea580c" text-anchor="start">无该资源指标 → riskLoad = 0</text>
<text x="684.0" y="344.0" font-size="11.8" fill="#64748b" text-anchor="start">μ = 0 → allocProb = 1</text>
<text x="684.0" y="362.0" font-size="11.8" fill="#64748b" text-anchor="start">σ = 0 → 按 μ ≤ 阈值取 1 或 0</text>
<rect x="170.0" y="430.0" width="620.0" height="100.0" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
<text x="480.0" y="454.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">合成</text>
<text x="190.0" y="478.0" font-size="12.5" fill="#334155" text-anchor="start">totalRisk(r) = clamp(w_r · riskLimit + (1 − w_r) · riskLoad, 0, 1)</text>
<text x="190.0" y="498.0" font-size="12" fill="#64748b" text-anchor="start">w_r = riskLimitWeights[r]，默认 cpu 0.5、memory 0.5</text>
<text x="190.0" y="518.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">rank = 1 − max(totalRisk(cpu), totalRisk(memory))，score = round(100 × rank)</text>
<line x1="300.0" y1="160.0" x2="336.0" y2="160.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="485.0" y1="234.0" x2="485.0" y2="258.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M630,160 L650,160 L650,120 L666,120" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
<line x1="485.0" y1="398.0" x2="485.0" y2="426.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M800,398 L800,415 L700,415 L700,426" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
</svg>
