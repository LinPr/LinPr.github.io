<text x="361.4" y="350.3" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">riskLoad = 0.136</text>
<text x="100.6" y="120.0" font-size="11.5" fill="#64748b" text-anchor="start">虚线 Beta(59.6, 89.4)</text>
<text x="100.6" y="136.0" font-size="11.5" fill="#64748b" text-anchor="start">不乘 √5 时，尾部只有 0.007</text>
<text x="158.9" y="286.7" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">Beta(11.6, 17.4)</text>
<rect x="650.0" y="96.0" width="230.0" height="344.0" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="664.0" y="120.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">图中各量</text>
<text x="664.0" y="146.0" font-size="11.8" fill="#334155" text-anchor="start">R⁻：节点上已有 Pod 的</text>
<text x="664.0" y="165.0" font-size="11.8" fill="#334155" text-anchor="start">request 之和（不含待调度 Pod）</text>
<text x="664.0" y="184.0" font-size="11.8" fill="#334155" text-anchor="start">L⁻：已有 Pod 的 limit 之和</text>
<text x="664.0" y="203.0" font-size="11.8" fill="#334155" text-anchor="start">C：Allocatable</text>
<text x="664.0" y="241.0" font-size="11.8" fill="#2563eb" text-anchor="start">allocProb = P(X ≤ R⁻/C)</text>
<text x="664.0" y="260.0" font-size="11.8" fill="#334155" text-anchor="start">若 L⁻ &lt; C：</text>
<text x="664.0" y="279.0" font-size="11.8" fill="#2563eb" text-anchor="start">  allocProb ÷= P(X ≤ L⁻/C)</text>
<text x="664.0" y="298.0" font-size="11.8" fill="#64748b" text-anchor="start">  （这里 P(X ≤ 0.75) ≈ 1）</text>
<text x="664.0" y="317.0" font-size="11.8" fill="#ea580c" text-anchor="start">riskLoad = 1 − allocProb</text>
<text x="664.0" y="355.0" font-size="11.8" fill="#334155" text-anchor="start">含义：已有 Pod 的实际负载</text>
<text x="664.0" y="374.0" font-size="11.8" fill="#334155" text-anchor="start">超出它们 request 的概率，</text>
<text x="664.0" y="393.0" font-size="11.8" fill="#334155" text-anchor="start">这部分超额会挤占新 Pod</text>
<text x="664.0" y="412.0" font-size="11.8" fill="#334155" text-anchor="start">被保证的 request。</text>
<text x="90.0" y="500.0" font-size="12" fill="#64748b" text-anchor="start">实线：smoothingWindowSize=5（默认）；虚线：假设窗口为 1。σ 被放大 √5 倍后，分布明显变宽，越过 R⁻/C 的尾部从 0.7% 增加到 13.6%。</text>
