<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500.0" y="32.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">一次分配在四个地方的落点</text>
  <text x="500.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">Reserve 只把结果挂进 in-flight 表；PreBind 写 API 成功后才进 assume cache，并撤掉 in-flight</text>
  <rect x="20" y="90" width="960" height="118" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="32.0" y="110.0" font-size="13" fill="#2563eb" font-weight="700">CycleState</text>
  <rect x="20" y="220" width="960" height="118" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="32.0" y="240.0" font-size="13" fill="#ea580c" font-weight="700">in-flight 表</text>
  <rect x="20" y="350" width="960" height="118" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="32.0" y="370.0" font-size="13" fill="#7c3aed" font-weight="700">assume cache</text>
  <rect x="20" y="480" width="960" height="118" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="32.0" y="500.0" font-size="13" fill="#059669" font-weight="700">API Server</text>
  <text x="150.0" y="80.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">PreFilter</text>
  <text x="330.0" y="80.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Filter（每节点并行）</text>
  <text x="510.0" y="80.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Reserve</text>
  <text x="700.0" y="80.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">PreBind（绑定 goroutine）</text>
  <text x="890.0" y="80.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">Unreserve（失败时）</text>
  <rect x="72.0" y="118" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="150.0" y="144.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">stateData{claims,</text>
  <text x="150.0" y="159.0" font-size="11" fill="#334155" text-anchor="middle">allocator, info[]}</text>
  <text x="150.0" y="174.0" font-size="11" fill="#334155" text-anchor="middle">NewAllocator(已分配集合)</text>
  <rect x="252.0" y="118" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="144.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">nodeAllocations</text>
  <text x="330.0" y="159.0" font-size="11" fill="#334155" text-anchor="middle">[node] = results</text>
  <text x="330.0" y="174.0" font-size="11" fill="#334155" text-anchor="middle">（加 mutex 写入）</text>
  <rect x="432.0" y="118" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="510.0" y="151.5" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">info[i].allocation</text>
  <text x="510.0" y="166.5" font-size="11" fill="#334155" text-anchor="middle">= results[选中节点]</text>
  <rect x="622.0" y="118" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700.0" y="151.5" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">claims.set(i,</text>
  <text x="700.0" y="166.5" font-size="11" fill="#334155" text-anchor="middle">  UpdateStatus 返回值)</text>
  <rect x="812.0" y="118" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="890.0" y="151.5" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">读同一个 stateData</text>
  <text x="890.0" y="166.5" font-size="11" fill="#334155" text-anchor="middle">决定要撤销什么</text>
  <rect x="72.0" y="248" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="150.0" y="274.0" font-size="11.5" fill="#ea580c" font-weight="700" text-anchor="middle">读：ListAllAllocated</text>
  <text x="150.0" y="289.0" font-size="11" fill="#334155" text-anchor="middle">Devices / Gather</text>
  <text x="150.0" y="304.0" font-size="11" fill="#334155" text-anchor="middle">AllocatedState</text>
  <rect x="252.0" y="248" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="274.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">不读不写</text>
  <text x="330.0" y="289.0" font-size="11" fill="#334155" text-anchor="middle">（Allocate 只用</text>
  <text x="330.0" y="304.0" font-size="11" fill="#334155" text-anchor="middle">PreFilter 的快照）</text>
  <rect x="432.0" y="248" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="510.0" y="274.0" font-size="11.5" fill="#ea580c" font-weight="700" text-anchor="middle">SignalClaimPending</text>
  <text x="510.0" y="289.0" font-size="11" fill="#334155" text-anchor="middle">Allocation(uid,</text>
  <text x="510.0" y="304.0" font-size="11" fill="#334155" text-anchor="middle">claim+allocation)</text>
  <rect x="622.0" y="248" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700.0" y="274.0" font-size="11.5" fill="#ea580c" font-weight="700" text-anchor="middle">PreBind 整体成功后</text>
  <text x="700.0" y="289.0" font-size="11" fill="#334155" text-anchor="middle">MaybeRemove…(uid,</text>
  <text x="700.0" y="304.0" font-size="11" fill="#334155" text-anchor="middle">force=true)</text>
  <rect x="812.0" y="248" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="890.0" y="274.0" font-size="11.5" fill="#ea580c" font-weight="700" text-anchor="middle">MaybeRemove…(uid,</text>
  <text x="890.0" y="289.0" font-size="11" fill="#334155" text-anchor="middle">false)：sharers-1，</text>
  <text x="890.0" y="304.0" font-size="11" fill="#334155" text-anchor="middle">归零才删除</text>
  <rect x="72.0" y="378" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="150.0" y="404.0" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="middle">读：Get claim</text>
  <text x="150.0" y="419.0" font-size="11" fill="#334155" text-anchor="middle">+ allocatedDevices</text>
  <text x="150.0" y="434.0" font-size="11" fill="#334155" text-anchor="middle">（事件维护的集合）</text>
  <rect x="252.0" y="378" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="419.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">不读不写</text>
  <rect x="432.0" y="378" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="510.0" y="404.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">不写</text>
  <text x="510.0" y="419.0" font-size="11" fill="#334155" text-anchor="middle">（只校验 claim</text>
  <text x="510.0" y="434.0" font-size="11" fill="#334155" text-anchor="middle">尚未被分配）</text>
  <rect x="622.0" y="378" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700.0" y="411.5" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="middle">AssumeClaimAfter</text>
  <text x="700.0" y="426.5" font-size="11" fill="#334155" text-anchor="middle">APICall(返回对象)</text>
  <rect x="812.0" y="378" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="890.0" y="404.0" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="middle">删掉 in-flight 时</text>
  <text x="890.0" y="419.0" font-size="11" fill="#334155" text-anchor="middle">AssumedClaimRestore</text>
  <text x="890.0" y="434.0" font-size="11" fill="#334155" text-anchor="middle">回到 informer 版本</text>
  <rect x="72.0" y="508" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="150.0" y="549.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">无写操作</text>
  <rect x="252.0" y="508" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="330.0" y="549.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">无写操作</text>
  <rect x="432.0" y="508" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="510.0" y="549.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">无写操作</text>
  <rect x="622.0" y="508" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="700.0" y="534.0" font-size="11.5" fill="#059669" font-weight="700" text-anchor="middle">Update 加 finalizer</text>
  <text x="700.0" y="549.0" font-size="11" fill="#334155" text-anchor="middle">UpdateStatus：</text>
  <text x="700.0" y="564.0" font-size="11" fill="#334155" text-anchor="middle">allocation+reservedFor</text>
  <rect x="812.0" y="508" width="156" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="890.0" y="534.0" font-size="11.5" fill="#059669" font-weight="700" text-anchor="middle">Patch status：从</text>
  <text x="890.0" y="549.0" font-size="11" fill="#334155" text-anchor="middle">reservedFor 删掉</text>
  <text x="890.0" y="564.0" font-size="11" fill="#334155" text-anchor="middle">本 Pod（若已写入）</text>
  <text x="500.0" y="618.0" font-size="11.5" fill="#64748b" text-anchor="middle">「已分配设备集合」只在 PreFilter 汇总一次：informer 侧集合 + in-flight 表；revision 变化就重试（最多 5 秒），避免漏掉途中的分配</text>
</svg>
