  <text x="40" y="401" font-size="12.5" fill="#1e3a8a" font-weight="700">score = 100 − int64( 100 × (cost − min) / (max − min) )，min/max 取可行节点 n-1、n-2、n-5（、n-6）的代价</text>
  <text x="40" y="424" font-size="12.5" fill="#334155">含 n-6：min 25，max 300；n-5 = 100 − int64(100 × 1 / 275) = 100 − int64(0.36) = 100，n-6 = 0</text>
