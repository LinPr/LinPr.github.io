<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="540" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
<text x="460.0" y="32.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">两种资源时的「均衡度」：离对角线越远，标准差越大</text>
<text x="460.0" y="54.0" font-size="13" fill="#64748b" text-anchor="middle">balancedResourceScore = (1 − std) × 100，两种资源时 std = |CPU 占比 − 内存占比| / 2；箭头是放上同一个 Pod 前后的变化</text>
<rect x="90.0" y="84.0" width="400.0" height="400.0" rx="2" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.2"/>
