<text x="82.0" y="168.0" font-size="11" fill="#64748b" text-anchor="end">80%</text>
<path d="M490.0,84.0 L490.0,484.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="490.0" y="502.0" font-size="11" fill="#64748b" text-anchor="middle">100%</text>
<path d="M90.0,84.0 L490.0,84.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="82.0" y="88.0" font-size="11" fill="#64748b" text-anchor="end">100%</text>
<text x="290.0" y="524.0" font-size="12.5" fill="#64748b" text-anchor="middle">CPU 请求占比</text>
<text x="38" y="284.0" font-size="12.5" fill="#64748b" text-anchor="middle" transform="rotate(-90 38 284.0)">内存请求占比</text>
<path d="M170.0,484.0 L490.0,164.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
<path d="M90.0,404.0 L410.0,84.0" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
