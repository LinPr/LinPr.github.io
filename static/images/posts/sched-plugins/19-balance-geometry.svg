<text x="138.0" y="404.0" font-size="11.5" fill="#059669" text-anchor="start">完全均衡：100 分</text>
<circle cx="370.0" cy="444.0" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<path d="M370.0,444.0 L410.0,284.0" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="410.0" cy="284.0" r="5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<circle cx="290.0" cy="284.0" r="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<path d="M290.0,284.0 L310.0,204.0" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a)"/>
<circle cx="310.0" cy="204.0" r="5" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<text x="378.0" y="460.0" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">X 前 70</text>
<text x="418.0" y="288.0" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">X 后 85</text>
<text x="298.0" y="298.0" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">Y 前 100</text>
<text x="302.0" y="196.0" font-size="11.5" fill="#7c3aed" text-anchor="end" font-weight="700">Y 后 92</text>
<rect x="540.0" y="84.0" width="356.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="556.0" y="108.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">Pod 请求 1 核 / 8Gi</text>
<text x="556.0" y="142.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">节点 X：10 核 / 20Gi</text>
<text x="556.0" y="164.0" font-size="12" fill="#64748b" text-anchor="start">前：CPU 7 核 70%，内存 2Gi 10%</text>
<text x="556.0" y="186.0" font-size="12" fill="#64748b" text-anchor="start">    std = |0.7 − 0.1| / 2 = 0.30 → 70</text>
<text x="556.0" y="208.0" font-size="12" fill="#64748b" text-anchor="start">后：CPU 8 核 80%，内存 10Gi 50%</text>
<text x="556.0" y="230.0" font-size="12" fill="#64748b" text-anchor="start">    std = |0.8 − 0.5| / 2 = 0.15 → 85</text>
<text x="556.0" y="258.0" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">节点 Y：20 核 / 40Gi</text>
<text x="556.0" y="280.0" font-size="12" fill="#64748b" text-anchor="start">前：CPU 10 核 50%，内存 20Gi 50% → 100</text>
<text x="556.0" y="302.0" font-size="12" fill="#64748b" text-anchor="start">后：CPU 11 核 55%，内存 28Gi 70%</text>
<text x="556.0" y="324.0" font-size="12" fill="#64748b" text-anchor="start">    std = |0.55 − 0.7| / 2 = 0.075 → 92</text>
<path d="M556.0,346.0 L880.0,346.0" stroke="#cbd5e1" stroke-width="1" fill="none"/>
<text x="556.0" y="370.0" font-size="12.5" fill="#1e293b" text-anchor="start">只看「放上之后」：X 85 &lt; Y 92，选 Y</text>
<text x="556.0" y="394.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">看「改善量」：X 82 &gt; Y 71，选 X</text>
<text x="556.0" y="416.0" font-size="11.5" fill="#64748b" text-anchor="start">X 被拉向对角线，Y 被推离对角线</text>
</svg>
