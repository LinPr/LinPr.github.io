<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="960" height="600" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<text x="480.0" y="34.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">CapacityScheduling 的三份用量记录</text>
<text x="480.0" y="58.0" font-size="13" fill="#64748b" text-anchor="middle">插件内存里的用量记录决定调度；CycleState 快照服务于一次调度周期；status.used 只给人看</text>
<rect x="30.0" y="90.0" width="290.0" height="104.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="42.0" y="120.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">Pod informer</text>
<text x="42.0" y="139.1" font-size="12.5" fill="#334155" text-anchor="start">只接收 spec.nodeName 非空的 Pod</text>
<text x="42.0" y="157.2" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Add → addPodIfNotPresent</text>
<text x="42.0" y="175.3" font-size="12.5" fill="#334155" text-anchor="start">Delete / 进入终态 → deletePodIfPresent</text>
<rect x="30.0" y="210.0" width="290.0" height="104.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="42.0" y="240.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700">ElasticQuota informer</text>
<text x="42.0" y="259.1" font-size="12.5" fill="#334155" text-anchor="start">Add：新建 Info，Used 从 0 开始</text>
<text x="42.0" y="277.2" font-size="12.5" fill="#334155" text-anchor="start">Update：换 Min/Max，沿用 pods 与 Used</text>
<text x="42.0" y="295.3" font-size="12.5" fill="#334155" text-anchor="start">Delete：整条删除</text>
<rect x="30.0" y="330.0" width="290.0" height="84.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="42.0" y="359.1" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">Reserve / Unreserve</text>
<text x="42.0" y="378.1" font-size="12.5" fill="#334155" text-anchor="start">Reserve：addPodIfNotPresent（加锁）</text>
<text x="42.0" y="396.2" font-size="12.5" fill="#334155" text-anchor="start">Unreserve：deletePodIfPresent（加锁）</text>
<rect x="358.0" y="150.0" width="280.0" height="200.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="370.0" y="200.8" font-size="15" fill="#059669" text-anchor="start" font-weight="700">c.elasticQuotaInfos</text>
<text x="370.0" y="219.9" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">map[namespace]*ElasticQuotaInfo</text>
<text x="370.0" y="238.0" font-size="12.5" fill="#334155" text-anchor="start">pods：sets.Set[ns/name]</text>
<text x="370.0" y="256.1" font-size="12.5" fill="#64748b" text-anchor="start">同一 Pod 重复加入不会重复计数</text>
<text x="370.0" y="274.2" font-size="12.5" fill="#334155" text-anchor="start">Min / Max / Used：*framework.Resource</text>
<text x="370.0" y="292.4" font-size="12.5" fill="#64748b" text-anchor="start">由 sync.RWMutex 保护</text>
<text x="370.0" y="310.5" font-size="12.5" fill="#334155" text-anchor="start">插件进程内的唯一权威用量</text>
<line x1="320.0" y1="142.0" x2="356.0" y2="215.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="320.0" y1="262.0" x2="356.0" y2="250.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="320.0" y1="372.0" x2="356.0" y2="300.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="660.0" y="90.0" width="270.0" height="150.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="672.0" y="133.9" font-size="15" fill="#0d9488" text-anchor="start" font-weight="700">ElasticQuotaSnapshot</text>
<text x="672.0" y="153.0" font-size="12.5" fill="#334155" text-anchor="start">PreFilter 开头 clone() 全部用量记录</text>
<text x="672.0" y="171.1" font-size="12.5" fill="#334155" text-anchor="start">DryRunPreemption 每个节点再</text>
<text x="672.0" y="189.2" font-size="12.5" fill="#334155" text-anchor="start">state.Clone() 深拷贝一份</text>
<text x="672.0" y="207.4" font-size="12.5" fill="#334155" text-anchor="start">AddPod / RemovePod 只改副本</text>
<rect x="660.0" y="256.0" width="270.0" height="120.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="672.0" y="284.9" font-size="15" fill="#0d9488" text-anchor="start" font-weight="700">PreFilterState</text>
<text x="672.0" y="304.0" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">podReq</text>
<text x="672.0" y="322.1" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">nominatedPodsReqInEQWithPodReq</text>
<text x="672.0" y="340.2" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">nominatedPodsReqWithPodReq</text>
<text x="672.0" y="358.4" font-size="12.5" fill="#64748b" text-anchor="start">Clone() 返回自身：写入后只读</text>
<line x1="638.0" y1="200.0" x2="658.0" y2="165.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30.0" y="446.0" width="900.0" height="128.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="46.0" y="470.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="700">另一个进程：scheduler-plugins controller（cmd/controller）</text>
<rect x="46.0" y="484.0" width="330.0" height="76.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="58.0" y="509.1" font-size="15" fill="#ea580c" text-anchor="start" font-weight="700">ElasticQuotaReconciler</text>
<text x="58.0" y="528.1" font-size="12.5" fill="#334155" text-anchor="start">列出 Namespace 内 Phase=Running 的 Pod</text>
<text x="58.0" y="546.2" font-size="12.5" fill="#334155" text-anchor="start">按请求量求和（overhead 实际未计入）</text>
<rect x="440.0" y="484.0" width="220.0" height="76.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="452.0" y="509.1" font-size="15" fill="#ea580c" text-anchor="start" font-weight="700">status.used</text>
<text x="452.0" y="528.1" font-size="12.5" fill="#334155" text-anchor="start">Status().Patch 写回</text>
<text x="452.0" y="546.2" font-size="12.5" fill="#64748b" text-anchor="start">kubectl get eq 的 Used 列</text>
<line x1="376.0" y1="522.0" x2="438.0" y2="522.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="700.0" y="484.0" width="214.0" height="76.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="712.0" y="509.1" font-size="15" fill="#dc2626" text-anchor="start" font-weight="700">调度器不读取</text>
<text x="712.0" y="528.1" font-size="12.5" fill="#334155" text-anchor="start">newElasticQuotaInfo 传入</text>
<text x="712.0" y="546.2" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">used = nil</text>
<path d="M 480 350 L 480 420 L 800 420 L 800 482" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="640.0" y="412.0" font-size="12.5" fill="#dc2626" text-anchor="middle">两处记录没有任何同步</text>
</svg>
