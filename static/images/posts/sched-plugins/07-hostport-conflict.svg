<text x="40.0" y="334.0" font-size="12" fill="#64748b" text-anchor="start">来自节点上已有 Pod 的 hostPort</text>
<text x="340.0" y="98.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">待调度 Pod 想要的端口</text>
