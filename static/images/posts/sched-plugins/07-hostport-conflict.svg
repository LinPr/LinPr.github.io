<text x="350.0" y="212.0" font-size="12" fill="#1e293b" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">10.0.0.6 / TCP / 80</text>
<rect x="528.0" y="188.0" width="230.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538.0" y="212.0" font-size="11.5" fill="#64748b" text-anchor="start">只查 0.0.0.0 与 10.0.0.6：都没有</text>
<rect x="766.0" y="193.0" width="110.0" height="28.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="821.0" y="212.0" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="700">通过</text>
<rect x="340.0" y="232.0" width="180.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350.0" y="256.0" font-size="12" fill="#1e293b" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">10.0.0.6 / TCP / 8080</text>
<rect x="528.0" y="232.0" width="230.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538.0" y="256.0" font-size="11.5" fill="#64748b" text-anchor="start">0.0.0.0 下有 TCP:8080</text>
<rect x="766.0" y="237.0" width="110.0" height="28.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="821.0" y="256.0" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">冲突</text>
<rect x="340.0" y="276.0" width="180.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350.0" y="300.0" font-size="12" fill="#1e293b" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">10.0.0.5 / UDP / 80</text>
<rect x="528.0" y="276.0" width="230.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538.0" y="300.0" font-size="11.5" fill="#64748b" text-anchor="start">10.0.0.5 下只有 TCP:80</text>
<rect x="766.0" y="281.0" width="110.0" height="28.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="821.0" y="300.0" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="700">通过</text>
<rect x="340.0" y="320.0" width="180.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="350.0" y="344.0" font-size="12" fill="#1e293b" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">"" / "" / 53</text>
<rect x="528.0" y="320.0" width="230.0" height="38.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538.0" y="344.0" font-size="11.5" fill="#64748b" text-anchor="start">补全为 0.0.0.0/TCP，没人占 TCP:53</text>
<rect x="766.0" y="325.0" width="110.0" height="28.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="821.0" y="344.0" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="700">通过</text>
<rect x="24.0" y="384.0" width="852.0" height="150.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40.0" y="408.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">三条规则（staging/src/k8s.io/kube-scheduler/framework/types.go）</text>
<text x="40.0" y="436.0" font-size="12.5" fill="#64748b" text-anchor="start">1. sanitize：hostIP 为空按 0.0.0.0，protocol 为空按 TCP；hostPort ≤ 0 直接视为不冲突</text>
<text x="40.0" y="460.0" font-size="12.5" fill="#64748b" text-anchor="start">2. 想要 0.0.0.0：在所有 IP 下查同一个 {protocol, port}，任何一个有就冲突</text>
<text x="40.0" y="484.0" font-size="12.5" fill="#64748b" text-anchor="start">3. 想要具体 IP：只查 "0.0.0.0" 和这个 IP 两个 key；不同的具体 IP 之间互不影响</text>
<text x="40.0" y="508.0" font-size="12.5" fill="#ea580c" text-anchor="start">冲突时 Filter 返回 Unschedulable（橙色）：删掉占端口的 Pod 就能解决，所以可以被 DefaultPreemption 抢占</text>
</svg>
