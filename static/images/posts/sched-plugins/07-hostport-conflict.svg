<text x="450.0" y="32.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">HostPortInfo.CheckConflict：三元组 (hostIP, protocol, port) 怎么判冲突</text>
<text x="450.0" y="54.0" font-size="13" fill="#64748b" text-anchor="middle">0.0.0.0 与任何 IP 冲突；具体 IP 只和自己及 0.0.0.0 冲突；协议不同不冲突</text>
