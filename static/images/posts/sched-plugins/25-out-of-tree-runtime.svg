<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="940" height="600" fill="#ffffff"/>
  <text x="470.0" y="32" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">out-of-tree 插件怎么跑起来：同一套框架，另一个二进制</text>
  <text x="470.0" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">编译期注册进 Registry，配置期由 Profile 启用，运行期按 spec.schedulerName 路由；排序队列全进程只有一个</text>
  <rect x="24" y="76" width="300" height="156" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="38" y="100" font-size="13.5" fill="#6d28d9" font-weight="700">① 编译期：注册插件工厂</text>
  <text x="38" y="124" font-size="11.5" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">// cmd/scheduler/main.go</text>
  <text x="38" y="141" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">app.NewSchedulerCommand(</text>
  <text x="38" y="158" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  app.WithPlugin(qos.Name, qos.New),</text>
  <text x="38" y="175" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  app.WithPlugin(coscheduling.Name, …),</text>
  <text x="38" y="192" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  … 共 15 个 WithPlugin</text>
  <text x="38" y="209" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">)</text>
  <rect x="344" y="76" width="270" height="156" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="358" y="100" font-size="13.5" fill="#1d4ed8" font-weight="700">② 启动：合并两张 Registry</text>
  <text x="358" y="124" font-size="12" fill="#334155">outOfTreeRegistry ← 每个 WithPlugin</text>
  <text x="358" y="146" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">NewInTreeRegistry()</text>
  <text x="358" y="163" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  .Merge(outOfTreeRegistry)</text>
  <text x="358" y="186" font-size="12" fill="#334155">重名时 Register 报错，启动失败</text>
  <text x="358" y="206" font-size="12" fill="#059669">→ in-tree 插件全部还在，可以混用</text>
  <rect x="634" y="76" width="282" height="156" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
  <text x="648" y="100" font-size="13.5" fill="#0f766e" font-weight="700">③ 配置：Profile 决定启用谁</text>
  <text x="648" y="124" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">profiles:</text>
  <text x="648" y="141" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">- schedulerName: default-scheduler</text>
  <text x="648" y="158" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  plugins:</text>
  <text x="648" y="175" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    queueSort:</text>
  <text x="648" y="192" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      enabled: [{name: QOSSort}]</text>
  <text x="648" y="209" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      disabled: [{name: "*"}]</text>
  <line x1="324" y1="154" x2="340" y2="154" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="614" y1="154" x2="630" y2="154" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="24" y="254" width="892" height="70" rx="8" fill="#f8fbff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="40" y="278" font-size="13.5" fill="#1e3a8a" font-weight="700">调度器进程里只有一个 SchedulingQueue（activeQ / backoffQ / unschedulablePods）</text>
  <text x="40" y="300" font-size="12.5" fill="#475569">堆的比较函数取自 profiles[0].QueueSortFunc()，所以 validateCommonQueueSort 要求每个 Profile 的 queueSort</text>
  <text x="40" y="317" font-size="12.5" fill="#475569">以及它的 args 完全相同；newFramework 还要求每个 Profile 恰好启用一个 QueueSort 插件</text>
  <line x1="470" y1="232" x2="470" y2="250" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="24" y="340" width="892" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="40" y="364" font-size="13.5" fill="#c2410c" font-weight="700">QueueSort 只能四选一：</text>
  <rect x="232" y="348" width="196" height="26" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="330.0" y="366" font-size="12.5" fill="#9a3412" text-anchor="middle">PrioritySort（in-tree 默认）</text>
  <rect x="440" y="348" width="92" height="26" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="486.0" y="366" font-size="12.5" fill="#9a3412" text-anchor="middle">QOSSort</text>
  <rect x="544" y="348" width="132" height="26" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="610.0" y="366" font-size="12.5" fill="#9a3412" text-anchor="middle">TopologicalSort</text>
  <rect x="688" y="348" width="116" height="26" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="746.0" y="366" font-size="12.5" fill="#9a3412" text-anchor="middle">Coscheduling</text>
  <text x="40" y="398" font-size="12" fill="#475569">默认 multiPoint 里带着 PrioritySort：要么在 multiPoint.disabled 里禁用它，要么 queueSort 下 disabled "*" 再显式启用，否则启动报错</text>
  <rect x="24" y="436" width="300" height="38" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="38" y="460" font-size="12" fill="#5b21b6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">schedulerName: default-scheduler</text>
  <line x1="324" y1="455" x2="356" y2="455" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="360" y="436" width="556" height="38" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="374" y="460" font-size="12.5" fill="#1e293b">出队后 frameworkForPod 选中 Profile「default-scheduler」，跑它的插件链</text>
  <rect x="24" y="486" width="300" height="38" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="38" y="510" font-size="12" fill="#5b21b6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">schedulerName: net-aware</text>
  <line x1="324" y1="505" x2="356" y2="505" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="360" y="486" width="556" height="38" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="374" y="510" font-size="12.5" fill="#1e293b">同一个队列、同一个 Less 排序；出队后交给 Profile「net-aware」的插件链</text>
  <rect x="24" y="536" width="300" height="38" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="38" y="560" font-size="12" fill="#5b21b6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">schedulerName: my-other-scheduler</text>
  <line x1="324" y1="555" x2="356" y2="555" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="360" y="536" width="556" height="38" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="374" y="560" font-size="12.5" fill="#1e293b">responsibleForPod 返回 false，本进程不入队，留给名字匹配的调度器</text>
</svg>
