<text x="265.0" y="318.0" font-size="12.5" fill="#7c3aed" text-anchor="end" font-weight="700">ΔP = 31.72 W</text>
<text x="250.0" y="415.8" font-size="11.5" fill="#059669" text-anchor="middle">30%</text>
<text x="150.0" y="395.4" font-size="11.5" fill="#7c3aed" text-anchor="middle">10%</text>
<rect x="630.0" y="90.0" width="290.0" height="380.0" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="644.0" y="114.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">算例：8 核，Pod request 2 核（+25%）</text>
<text x="644.0" y="144.0" font-size="11.5" fill="#64748b" text-anchor="start">节点</text>
<text x="682.0" y="144.0" font-size="11.5" fill="#64748b" text-anchor="start">利用率</text>
<text x="906.0" y="144.0" font-size="11.5" fill="#64748b" text-anchor="end">Score 原始值</text>
<text x="644.0" y="168.0" font-size="13" fill="#059669" text-anchor="start" font-weight="700">n1</text>
<text x="682.0" y="168.0" font-size="12" fill="#334155" text-anchor="start">30% → 55%</text>
<text x="682.0" y="185.0" font-size="11.5" fill="#64748b" text-anchor="start">ΔP 35.46 W</text>
<text x="906.0" y="168.0" font-size="12" fill="#334155" text-anchor="end" font-weight="700">3.546×10¹⁶</text>
<text x="644.0" y="214.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">n2</text>
<text x="682.0" y="214.0" font-size="12" fill="#334155" text-anchor="start">10% → 35%</text>
<text x="682.0" y="231.0" font-size="11.5" fill="#64748b" text-anchor="start">ΔP 31.72 W</text>
<text x="906.0" y="214.0" font-size="12" fill="#334155" text-anchor="end" font-weight="700">3.172×10¹⁶</text>
<text x="644.0" y="260.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">n3</text>
<text x="682.0" y="260.0" font-size="12" fill="#334155" text-anchor="start">90% → 115%</text>
<text x="682.0" y="277.0" font-size="11.5" fill="#64748b" text-anchor="start">预测超过 100</text>
<text x="906.0" y="260.0" font-size="12" fill="#334155" text-anchor="end" font-weight="700">0</text>
<line x1="644.0" y1="290.0" x2="906.0" y2="290.0" stroke="#fed7aa" stroke-width="1.2"/>
<text x="644.0" y="310.0" font-size="11.5" fill="#334155" text-anchor="start">NormalizeScore：</text>
<text x="660.0" y="328.0" font-size="11.5" fill="#334155" text-anchor="start">100 − ⌊100·(v − min) / (max − min)⌋</text>
<text x="644.0" y="354.0" font-size="12" fill="#334155" text-anchor="start" font-weight="700">只有 n1、n2：</text>
<text x="740.0" y="354.0" font-size="12" fill="#334155" text-anchor="start">n1 → 0，n2 → 100</text>
<text x="644.0" y="378.0" font-size="12" fill="#334155" text-anchor="start" font-weight="700">加上 n3：</text>
<text x="740.0" y="378.0" font-size="12" fill="#334155" text-anchor="start">n1 → 0，n2 → 11，</text>
<text x="740.0" y="396.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">n3 → 100</text>
<text x="644.0" y="422.0" font-size="11.5" fill="#dc2626" text-anchor="start">预测超载的 n3 原始值是 0，</text>
<text x="644.0" y="440.0" font-size="11.5" fill="#dc2626" text-anchor="start">被当成「功耗跳变最小」，反而满分</text>
<text x="100.0" y="530.0" font-size="12" fill="#64748b" text-anchor="start">n1 在任何利用率下功耗都低于 n2，但它已处在指数曲线更陡的位置，再加 25% 的边际功耗更大，Peaks 选 n2。</text>
<text x="100.0" y="550.0" font-size="12" fill="#64748b" text-anchor="start">Peaks 最小化的是边际功耗，不是节点的绝对功耗或能效。</text>
</svg>
