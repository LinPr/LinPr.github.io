<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500.0" y="32.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">调度周期与绑定周期：assume 让两者解耦</text>
  <text x="500.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">左列串行执行，Permit 之后起 goroutine；中列并行执行；右列是 Pod 在调度器缓存里的状态</text>
  <text x="170.0" y="84.0" font-size="13.5" fill="#2563eb" font-weight="700" text-anchor="middle">调度周期（主循环，串行）</text>
  <text x="500.0" y="84.0" font-size="13.5" fill="#7c3aed" font-weight="700" text-anchor="middle">绑定周期（每 Pod 一个 goroutine）</text>
  <text x="850.0" y="84.0" font-size="13.5" fill="#0d9488" font-weight="700" text-anchor="middle">cache 中的 Pod 状态</text>
  <rect x="40" y="100" width="260" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="170.0" y="123.9" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">UpdateSnapshot</text>
  <text x="170.0" y="140.9" font-size="11.5" fill="#334155" text-anchor="middle">cache → nodeInfoSnapshot</text>
  <rect x="40" y="170" width="260" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="170.0" y="193.9" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">SchedulePod</text>
  <text x="170.0" y="210.9" font-size="11.5" fill="#334155" text-anchor="middle">PreFilter / Filter / Score</text>
  <rect x="40" y="240" width="260" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="170.0" y="264.4" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">AssumeAndReserveInCache</text>
  <text x="170.0" y="281.4" font-size="11.5" fill="#334155" text-anchor="middle">NodeName=host → cache.AssumePod</text>
  <text x="170.0" y="298.4" font-size="11.5" fill="#334155" text-anchor="middle">再跑 Reserve 插件</text>
  <rect x="40" y="330" width="260" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="170.0" y="353.9" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">RunPermitPlugins</text>
  <text x="170.0" y="370.9" font-size="11.5" fill="#334155" text-anchor="middle">Wait → AddWaitingPod</text>
  <rect x="40" y="400" width="260" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="170.0" y="423.9" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">go runBindingCycle(…)</text>
  <text x="170.0" y="440.9" font-size="11.5" fill="#334155" text-anchor="middle">主循环立刻取下一个 Pod</text>
  <line x1="170" y1="156" x2="170" y2="166" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="170" y1="226" x2="170" y2="236" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="170" y1="314" x2="170" y2="326" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="170" y1="386" x2="170" y2="396" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="370" y="100" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="123.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">PreBindPreFlight</text>
  <text x="500.0" y="140.9" font-size="11.5" fill="#334155" text-anchor="middle">需要时 patch NNN=host（提示 CA）</text>
  <rect x="370" y="170" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="193.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">WaitOnPermit</text>
  <text x="500.0" y="210.9" font-size="11.5" fill="#334155" text-anchor="middle">被拒 → FitError</text>
  <rect x="370" y="240" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="263.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">Queue.Done(uid)</text>
  <text x="500.0" y="280.9" font-size="11.5" fill="#334155" text-anchor="middle">此后失败只进 backoffQ</text>
  <rect x="370" y="310" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="333.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">RunPreBindPlugins</text>
  <text x="500.0" y="350.9" font-size="11.5" fill="#334155" text-anchor="middle">AddPodInPreBind，可被抢占取消</text>
  <rect x="370" y="380" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="403.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">MarkPrebound</text>
  <text x="500.0" y="420.9" font-size="11.5" fill="#334155" text-anchor="middle">已被取消则返回 Cause</text>
  <rect x="370" y="450" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="473.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">bind()</text>
  <text x="500.0" y="490.9" font-size="11.5" fill="#334155" text-anchor="middle">extender 优先 → RunBindPlugins</text>
  <rect x="370" y="520" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="500.0" y="543.9" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle">DefaultBinder.Bind</text>
  <text x="500.0" y="560.9" font-size="11.5" fill="#334155" text-anchor="middle">POST pods/{name}/binding</text>
  <rect x="370" y="590" width="260" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="500.0" y="613.9" font-size="12.5" fill="#059669" font-weight="700" text-anchor="middle">成功：Event Scheduled</text>
  <text x="500.0" y="630.9" font-size="11.5" fill="#334155" text-anchor="middle">RunPostBindPlugins，Activate</text>
  <line x1="500" y1="156" x2="500" y2="166" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="226" x2="500" y2="236" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="296" x2="500" y2="306" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="366" x2="500" y2="376" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="436" x2="500" y2="446" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="506" x2="500" y2="516" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <line x1="500" y1="576" x2="500" y2="586" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ap)"/>
  <path d="M300,428 L322,428 L322,128 L366,128" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ap)"/>
  <rect x="730" y="240" width="240" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="850.0" y="264.4" font-size="12.5" fill="#0d9488" font-weight="700" text-anchor="middle">Assumed</text>
  <text x="850.0" y="281.4" font-size="11.5" fill="#334155" text-anchor="middle">podStates[key] + assumedPods</text>
  <text x="850.0" y="298.4" font-size="11.5" fill="#334155" text-anchor="middle">NodeInfo 已计入资源</text>
  <path d="M300,262 L338,262 L338,233 L700,233 L700,262 L726,262" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <rect x="730" y="520" width="240" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="850.0" y="544.4" font-size="12.5" fill="#0d9488" font-weight="700" text-anchor="middle">Added</text>
  <text x="850.0" y="561.4" font-size="11.5" fill="#334155" text-anchor="middle">informer 看到 spec.nodeName</text>
  <text x="850.0" y="578.4" font-size="11.5" fill="#334155" text-anchor="middle">AddPod：updatePod 移出 assumed</text>
  <line x1="630" y1="548" x2="726" y2="548" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <line x1="850" y1="314" x2="850" y2="516" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="858.0" y="420.0" font-size="11" fill="#0d9488">Bind 成功</text>
  <text x="858.0" y="436.0" font-size="11" fill="#0d9488">+ informer 事件</text>
  <rect x="40" y="520" width="280" height="150" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="52.0" y="545.4" font-size="12.5" fill="#ea580c" font-weight="700">失败：handleBindingCycleError</text>
  <text x="52.0" y="563.4" font-size="11.5" fill="#334155">① RunReservePluginsUnreserve</text>
  <text x="52.0" y="581.4" font-size="11.5" fill="#334155">② cache.ForgetPod（Assumed → 删除）</text>
  <text x="52.0" y="599.4" font-size="11.5" fill="#334155">③ MoveAllToActiveOrBackoffQueue</text>
  <text x="52.0" y="617.4" font-size="11.5" fill="#334155">    (EventAssignedPodDelete)</text>
  <text x="52.0" y="635.4" font-size="11.5" fill="#334155">④ FailureHandler：清 NNN，</text>
  <text x="52.0" y="653.4" font-size="11.5" fill="#334155">    Error → backoffQ</text>
  <line x1="370" y1="198" x2="348" y2="198" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="370" y1="338" x2="348" y2="338" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="370" y1="408" x2="348" y2="408" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="370" y1="478" x2="348" y2="478" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="370" y1="548" x2="348" y2="548" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M348,198 L348,595 L324,595" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ao)"/>
  <text x="500.0" y="700.0" font-size="11.5" fill="#64748b" text-anchor="middle">绑定周期里任何一步失败都走左下角的回滚；回滚把「已 assume 的资源」当作一次 Pod 删除广播出去，让其他等资源的 Pod 有机会重试</text>
  <text x="500.0" y="720.0" font-size="11.5" fill="#64748b" text-anchor="middle">cache 里没有超时机制：Assumed 状态只会被 informer 的 AddPod 确认，或被 ForgetPod 撤销</text>
</svg>
