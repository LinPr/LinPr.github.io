<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="470.0" y="34" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="bold">NodeResourcesAllocatable：只看节点规格，与节点上跑了什么无关</text>
<text x="470.0" y="58" font-size="13" fill="#64748b" text-anchor="middle">默认权重 cpu=1&lt;&lt;20、memory=1；原始分 = Σ(allocatable×权重)/Σ权重，Least 取负；再按 min-max 线性映射到 [0,100]</text>
<text x="40" y="100" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">节点（allocatable）</text>
<text x="210" y="100" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">原始分绝对值</text>
<text x="380" y="100" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">mode: Least</text>
<text x="560" y="100" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="bold">mode: Most</text>
<text x="740" y="100" font-size="13.5" fill="#0d9488" text-anchor="start" font-weight="bold">Fit LeastAllocated*</text>
<rect x="30" y="120" width="880" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="150" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">small</text>
<text x="40" y="172" font-size="12.5" fill="#64748b" text-anchor="start">4C / 16Gi</text>
<text x="210" y="150" font-size="14" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">20,383</text>
<text x="210" y="172" font-size="12" fill="#64748b" text-anchor="start">≈ MiB 当量</text>
<rect x="380" y="144" width="120" height="20" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="380" y="144" width="120.0" height="20" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="508" y="159" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">100</text>
<rect x="560" y="144" width="120" height="20" rx="4" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="688" y="159" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="bold">0</text>
<rect x="740" y="144" width="120" height="20" rx="4" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1"/>
<rect x="740" y="144" width="97.2" height="20" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="868" y="159" font-size="13.5" fill="#0d9488" text-anchor="start" font-weight="bold">81</text>
<rect x="30" y="200" width="880" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="230" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">medium</text>
<text x="40" y="252" font-size="12.5" fill="#64748b" text-anchor="start">16C / 64Gi</text>
<text x="210" y="230" font-size="14" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">81,535</text>
<text x="210" y="252" font-size="12" fill="#64748b" text-anchor="start">≈ MiB 当量</text>
<rect x="380" y="224" width="120" height="20" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="380" y="224" width="96.0" height="20" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="508" y="239" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">80</text>
<rect x="560" y="224" width="120" height="20" rx="4" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="560" y="224" width="24.0" height="20" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="688" y="239" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="bold">20</text>
<rect x="740" y="224" width="120" height="20" rx="4" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1"/>
<rect x="740" y="224" width="112.8" height="20" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="868" y="239" font-size="13.5" fill="#0d9488" text-anchor="start" font-weight="bold">94</text>
<rect x="30" y="280" width="880" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="310" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">memheavy</text>
<text x="40" y="332" font-size="12.5" fill="#64748b" text-anchor="start">8C / 128Gi</text>
<text x="210" y="310" font-size="14" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">139,071</text>
<text x="210" y="332" font-size="12" fill="#64748b" text-anchor="start">≈ MiB 当量</text>
<rect x="380" y="304" width="120" height="20" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="380" y="304" width="73.2" height="20" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="508" y="319" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">61</text>
<rect x="560" y="304" width="120" height="20" rx="4" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="560" y="304" width="45.6" height="20" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="688" y="319" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="bold">38</text>
<rect x="740" y="304" width="120" height="20" rx="4" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1"/>
<rect x="740" y="304" width="110.4" height="20" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="868" y="319" font-size="13.5" fill="#0d9488" text-anchor="start" font-weight="bold">92</text>
<rect x="30" y="360" width="880" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="390" font-size="14" fill="#1e293b" text-anchor="start" font-weight="bold">large</text>
<text x="40" y="412" font-size="12.5" fill="#64748b" text-anchor="start">64C / 256Gi</text>
<text x="210" y="390" font-size="14" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">326,143</text>
<text x="210" y="412" font-size="12" fill="#64748b" text-anchor="start">≈ MiB 当量</text>
<rect x="380" y="384" width="120" height="20" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<text x="508" y="399" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">0</text>
<rect x="560" y="384" width="120" height="20" rx="4" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="560" y="384" width="120.0" height="20" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="688" y="399" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="bold">100</text>
<rect x="740" y="384" width="120" height="20" rx="4" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1"/>
<rect x="740" y="384" width="117.6" height="20" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="868" y="399" font-size="13.5" fill="#0d9488" text-anchor="start" font-weight="bold">98</text>
<text x="40" y="454" font-size="12.5" fill="#64748b" text-anchor="start">* 对照：in-tree NodeResourcesFit 默认 LeastAllocated，Pod 请求 1 CPU / 2Gi，节点为空。它在乎的是比例，所以偏好大节点。</text>
<rect x="30" y="470" width="880" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="46" y="498" font-size="13" fill="#334155" text-anchor="start">Least 模式把小 Pod 推向小节点，Fit 的默认打分却偏好大节点，两者方向相反：</text>
<text x="46" y="522" font-size="13" fill="#334155" text-anchor="start">权重都为 1 时 small 得 100+81=181，large 得 0+98=98，Allocatable 的区分度（0~100）明显大于 Fit（81~98）。</text>
</svg>
