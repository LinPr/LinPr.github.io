<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="980" height="560" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<text x="490.0" y="34.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">bruteForceDryRunPreemption：枚举受害者子集</text>
<text x="490.0" y="58.0" font-size="13" fill="#64748b" text-anchor="middle">左：两个低优先级 Pod 的 dfs 递归树；右：每个叶子上 dryRunOnePass 做的事；下：子集数随 Pod 数指数增长</text>
<rect x="190.0" y="82.0" width="160.0" height="40.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="270.0" y="106.3" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">dfs(i=0, path=[])</text>
<rect x="90.0" y="162.0" width="150.0" height="40.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="165.0" y="186.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">i=1 path=[pod-a]</text>
<rect x="330.0" y="162.0" width="150.0" height="40.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="405.0" y="186.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">i=1 path=[]</text>
<line x1="250.0" y1="122.0" x2="165.0" y2="160.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="290.0" y1="122.0" x2="395.0" y2="160.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<text x="186.0" y="146.0" font-size="12" fill="#64748b" text-anchor="end">选 pod-a</text>
<text x="358.0" y="146.0" font-size="12" fill="#64748b" text-anchor="start">不选</text>
<line x1="160.0" y1="202.0" x2="85.0" y2="248.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30.0" y="250.0" width="110.0" height="100.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="85.0" y="278.7" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">{a, b}</text>
<text x="85.0" y="296.9" font-size="12" fill="#334155" text-anchor="middle">node-a ✓</text>
<text x="85.0" y="314.3" font-size="12" fill="#334155" text-anchor="middle">node-b ✓</text>
<text x="85.0" y="331.7" font-size="12" fill="#64748b" text-anchor="middle">→ 2 个候选</text>
<line x1="160.0" y1="202.0" x2="205.0" y2="248.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="150.0" y="250.0" width="110.0" height="100.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="205.0" y="278.7" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700">{a}</text>
<text x="205.0" y="296.9" font-size="12" fill="#334155" text-anchor="middle">node-a</text>
<text x="205.0" y="314.3" font-size="12" fill="#334155" text-anchor="middle">skew 2 ✗</text>
<text x="205.0" y="331.7" font-size="12" fill="#64748b" text-anchor="middle">→ 无</text>
<line x1="400.0" y1="202.0" x2="325.0" y2="248.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="270.0" y="250.0" width="110.0" height="100.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="325.0" y="278.7" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700">{b}</text>
<text x="325.0" y="296.9" font-size="12" fill="#334155" text-anchor="middle">node-b</text>
<text x="325.0" y="314.3" font-size="12" fill="#334155" text-anchor="middle">skew 2 ✗</text>
<text x="325.0" y="331.7" font-size="12" fill="#64748b" text-anchor="middle">→ 无</text>
<line x1="400.0" y1="202.0" x2="445.0" y2="248.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="390.0" y="250.0" width="110.0" height="100.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="445.0" y="278.7" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">{ }</text>
<text x="445.0" y="296.9" font-size="12" fill="#334155" text-anchor="middle">没有节点</text>
<text x="445.0" y="314.3" font-size="12" fill="#334155" text-anchor="middle">可试</text>
<text x="445.0" y="331.7" font-size="12" fill="#64748b" text-anchor="middle">→ 无</text>
<text x="102.0" y="236.0" font-size="11.5" fill="#64748b" text-anchor="end">选 pod-b</text>
<text x="222.0" y="236.0" font-size="11.5" fill="#64748b" text-anchor="start">不选</text>
<text x="342.0" y="236.0" font-size="11.5" fill="#64748b" text-anchor="end">选 pod-b</text>
<text x="462.0" y="236.0" font-size="11.5" fill="#64748b" text-anchor="start">不选</text>
<rect x="530.0" y="82.0" width="420.0" height="268.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="542.0" y="132.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700">dryRunOnePass(path)</text>
<text x="542.0" y="151.1" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1. stateCopy := state.Clone()</text>
<text x="542.0" y="169.2" font-size="12.5" fill="#334155" text-anchor="start">2. 对子集里的每个 Pod：</text>
<text x="542.0" y="187.3" font-size="12.5" fill="#334155" text-anchor="start">· 取它所在节点 → Clone() → RemovePod</text>
<text x="542.0" y="204.9" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">· RunPreFilterExtensionRemovePod</text>
<text x="542.0" y="222.8" font-size="12.5" fill="#334155" text-anchor="start">3. 只在这些节点副本上跑</text>
<text x="542.0" y="240.4" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">· RunFilterPluginsWithNominatedPods</text>
<text x="542.0" y="258.4" font-size="12.5" fill="#334155" text-anchor="start">4. 通过的节点各生成一个 candidate，</text>
<text x="542.0" y="276.5" font-size="12.5" fill="#334155" text-anchor="start">· victims = 整个子集，PDB 违反数恒为 0</text>
<text x="542.0" y="294.1" font-size="12" fill="#64748b" text-anchor="start">同一节点上的两个受害者会各自 Clone 一次节点，</text>
<text x="542.0" y="311.5" font-size="12" fill="#64748b" text-anchor="start">每份副本只少了其中一个 Pod</text>
<rect x="30.0" y="380.0" width="920.0" height="160.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="50.0" y="406.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">代价：叶子数 = 2ⁿ，每个叶子还要跑一次完整的 Filter 链</text>
<text x="60.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="700">低优先级 Pod 数 n</text>
<text x="260.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="700">子集数 2ⁿ</text>
<text x="460.0" y="438.0" font-size="13" fill="#64748b" text-anchor="start" font-weight="700">说明</text>
<text x="60.0" y="462.0" font-size="13" fill="#334155" text-anchor="start">10</text>
<text x="260.0" y="462.0" font-size="13" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1,024</text>
<text x="460.0" y="462.0" font-size="13" fill="#334155" text-anchor="start">一个小节点池就能达到</text>
<text x="60.0" y="486.0" font-size="13" fill="#334155" text-anchor="start">20</text>
<text x="260.0" y="486.0" font-size="13" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1,048,576</text>
<text x="460.0" y="486.0" font-size="13" fill="#334155" text-anchor="start">单次 PostFilter 已不可接受</text>
<text x="60.0" y="510.0" font-size="13" fill="#334155" text-anchor="start">30</text>
<text x="260.0" y="510.0" font-size="13" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1,073,741,824</text>
<text x="460.0" y="510.0" font-size="13" fill="#334155" text-anchor="start">几十个节点的集群很容易超过</text>
</svg>
