<text x="655.0" y="170.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">淘汰</text>
<text x="737.0" y="170.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">—</text>
<text x="824.0" y="170.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不检查</text>
<text x="923.0" y="170.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不驱逐</text>
<rect x="490.0" y="188.0" width="486.0" height="46.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="496.0" y="216.0" font-size="11.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">PreferNoSchedule</text>
<text x="655.0" y="216.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不检查</text>
<text x="737.0" y="216.0" font-size="12.5" fill="#0d9488" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">扣分</text>
<text x="824.0" y="216.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不检查</text>
<text x="923.0" y="216.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不驱逐</text>
<rect x="490.0" y="234.0" width="486.0" height="46.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="496.0" y="262.0" font-size="11.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">NoExecute</text>
<text x="655.0" y="262.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">淘汰</text>
<text x="737.0" y="262.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">—</text>
<text x="824.0" y="262.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">拒绝</text>
<text x="923.0" y="262.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">驱逐</text>
<text x="490.0" y="302.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">kubelet 准入</text>
<text x="504.0" y="324.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">generalFilter 只看 NoExecute，静态 Pod 除外</text>
<text x="490.0" y="346.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">taint-eviction-controller</text>
<text x="504.0" y="368.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不被容忍的 NoExecute → 立即删除；被容忍但设了</text>
<text x="504.0" y="390.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">tolerationSeconds → 到期删除（取匹配容忍中的最小值）</text>
<text x="490.0" y="412.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">DefaultTolerationSeconds 准入插件</text>
<text x="504.0" y="434.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">默认添加 not-ready / unreachable:NoExecute 各 300s 容忍</text>
<rect x="490.0" y="470.0" width="486.0" height="74.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="733.0" y="493.9" font-size="12" fill="#2563eb" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">调度器 Filter 对 NoExecute 返回 U&amp;U，与 NoSchedule 相同：</text>
<text x="733.0" y="511.3" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">调度时两者无区别，区别只在 Pod 已经运行之后</text>
<text x="733.0" y="528.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">（NoExecute 会把已运行的 Pod 赶走，NoSchedule 不会）</text>
</svg>