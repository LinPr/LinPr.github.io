<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="450" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker></defs>
<text x="460.0" y="32.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">ImageLocality：镜像大小 × 铺开程度，再夹到 [23MiB, 1000MiB × 镜像数]</text>
<text x="460.0" y="54.0" font-size="13" fill="#64748b" text-anchor="middle">sumScores = Σ size × numNodes / totalNodes（只算节点上已有的镜像）；score = 100 × (sum − 23MiB) / (max − 23MiB)</text>
<rect x="80.0" y="92.0" width="440.0" height="300.0" rx="4" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.2"/>
<path d="M80.0,92.0 L80.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="80.0" y="410.0" font-size="11" fill="#64748b" text-anchor="middle">0</text>
<path d="M180.0,92.0 L180.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="180.0" y="410.0" font-size="11" fill="#64748b" text-anchor="middle">500</text>
<path d="M280.0,92.0 L280.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="280.0" y="410.0" font-size="11" fill="#64748b" text-anchor="middle">1000</text>
<path d="M380.0,92.0 L380.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="380.0" y="410.0" font-size="11" fill="#64748b" text-anchor="middle">1500</text>
<path d="M480.0,92.0 L480.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="480.0" y="410.0" font-size="11" fill="#64748b" text-anchor="middle">2000</text>
<path d="M80.0,392.0 L520.0,392.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="72.0" y="396.0" font-size="11" fill="#64748b" text-anchor="end">0</text>
<path d="M80.0,317.0 L520.0,317.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="72.0" y="321.0" font-size="11" fill="#64748b" text-anchor="end">25</text>
<path d="M80.0,242.0 L520.0,242.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="72.0" y="246.0" font-size="11" fill="#64748b" text-anchor="end">50</text>
<path d="M80.0,167.0 L520.0,167.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="72.0" y="171.0" font-size="11" fill="#64748b" text-anchor="end">75</text>
<path d="M80.0,92.0 L520.0,92.0" stroke="#eef2f7" stroke-width="1" fill="none"/>
<text x="72.0" y="96.0" font-size="11" fill="#64748b" text-anchor="end">100</text>
<text x="300.0" y="432.0" font-size="12" fill="#64748b" text-anchor="middle">sumScores（MiB，已按铺开程度缩放）</text>
<polyline points="80.0,392.0 84.6,392.0 280.0,92.0 520.0,92.0" stroke="#2563eb" stroke-width="2.2" fill="none"/>
<polyline points="80.0,392.0 84.6,392.0 480.0,92.0 520.0,92.0" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/>
<path d="M84.6,92.0 L84.6,392.0" stroke="#94a3b8" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
<text x="88.6" y="106.0" font-size="10.5" fill="#64748b" text-anchor="start">23MiB</text>
<text x="292.0" y="108.0" font-size="11" fill="#2563eb" text-anchor="start">1 个镜像：1000MiB 封顶</text>
<text x="356.0" y="227.0" font-size="11" fill="#7c3aed" text-anchor="start">2 个镜像：2000MiB 封顶</text>
<circle cx="208.0" cy="203.0" r="5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="218.0" y="219.0" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">A：640 → 63</text>
<circle cx="86.4" cy="392.0" r="5" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="132.0" y="386.0" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">C：32 → 0</text>
<circle cx="218.0" cy="293.0" r="5" fill="#7c3aed" stroke="none" stroke-width="1.5"/>
<text x="228.0" y="309.0" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">D：690 → 33</text>
<rect x="548.0" y="92.0" width="348.0" height="300.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="564.0" y="116.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">集群 50 个节点，镜像 app:v3 大小 800MiB</text>
<text x="564.0" y="146.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">A</text>
<text x="588.0" y="146.0" font-size="12" fill="#1e293b" text-anchor="start">40 个节点有它</text>
<text x="588.0" y="165.0" font-size="11.5" fill="#64748b" text-anchor="start">800 × 40/50 = 640</text>
<text x="878.0" y="154.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="700">63</text>
<text x="564.0" y="196.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">B</text>
<text x="588.0" y="196.0" font-size="12" fill="#1e293b" text-anchor="start">50 个节点都有</text>
<text x="588.0" y="215.0" font-size="11.5" fill="#64748b" text-anchor="start">800 × 50/50 = 800</text>
<text x="878.0" y="204.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="700">79</text>
<text x="564.0" y="246.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">C</text>
<text x="588.0" y="246.0" font-size="12" fill="#1e293b" text-anchor="start">只有 2 个节点有</text>
<text x="588.0" y="265.0" font-size="11.5" fill="#64748b" text-anchor="start">800 × 2/50 = 32</text>
<text x="878.0" y="254.0" font-size="15" fill="#2563eb" text-anchor="end" font-weight="700">0</text>
<text x="564.0" y="296.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">D</text>
<text x="588.0" y="296.0" font-size="12" fill="#1e293b" text-anchor="start">app 同 A + sidecar 50MiB 全有</text>
<text x="588.0" y="315.0" font-size="11.5" fill="#64748b" text-anchor="start">640 + 50 = 690，上限 2000</text>
<text x="878.0" y="304.0" font-size="15" fill="#7c3aed" text-anchor="end" font-weight="700">33</text>
<text x="564.0" y="350.0" font-size="11.5" fill="#64748b" text-anchor="start">没有该镜像的节点：sum = 0，夹到 23MiB，得 0</text>
<text x="564.0" y="370.0" font-size="11.5" fill="#059669" text-anchor="start">C 说明稀有镜像几乎不加分，避免副本扎堆</text>
</svg>
