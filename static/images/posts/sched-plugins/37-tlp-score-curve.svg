<text x="680.0" y="120.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">算例（8 核，T=40）</text>
<text x="680.0" y="140.0" font-size="11.5" fill="#334155" text-anchor="start">Pod：limit 1000m → +12.5%</text>
<text x="680.0" y="170.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">A</text>
<text x="700.0" y="170.0" font-size="11.5" fill="#334155" text-anchor="start">10% + 12.5%</text>
<text x="700.0" y="186.0" font-size="11.5" fill="#64748b" text-anchor="start">U=22.5</text>
<text x="852.0" y="178.0" font-size="13" fill="#059669" text-anchor="end" font-weight="700">74 分</text>
<text x="680.0" y="214.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">B</text>
<text x="700.0" y="214.0" font-size="11.5" fill="#334155" text-anchor="start">25% + 12.5%</text>
<text x="700.0" y="230.0" font-size="11.5" fill="#64748b" text-anchor="start">U=37.5</text>
<text x="852.0" y="222.0" font-size="13" fill="#059669" text-anchor="end" font-weight="700">96 分</text>
<text x="680.0" y="258.0" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">C</text>
<text x="700.0" y="258.0" font-size="11.5" fill="#334155" text-anchor="start">45% + 12.5%</text>
<text x="700.0" y="274.0" font-size="11.5" fill="#64748b" text-anchor="start">U=57.5</text>
<text x="852.0" y="266.0" font-size="13" fill="#059669" text-anchor="end" font-weight="700">28 分</text>
<line x1="680.0" y1="290.0" x2="852.0" y2="290.0" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="680.0" y="310.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">B'</text>
<text x="700.0" y="310.0" font-size="11.5" fill="#334155" text-anchor="start">B 上 20 秒前刚绑定一个</text>
<text x="700.0" y="326.0" font-size="11.5" fill="#334155" text-anchor="start">request 500m 的 Pod</text>
<text x="700.0" y="342.0" font-size="11.5" fill="#64748b" text-anchor="start">补偿 750m → U=46.875</text>
<text x="852.0" y="360.0" font-size="13" fill="#ea580c" text-anchor="end" font-weight="700">35 分</text>
<text x="680.0" y="382.0" font-size="11.5" fill="#ea580c" text-anchor="start">补偿让 B 从第一掉到最后</text>
<text x="100.0" y="528.0" font-size="12" fill="#64748b" text-anchor="start">注：U 恰好等于 T 时走上升分支，得 100 分；超过 T 后第一点就跌到 T 分附近，曲线在 T 处不连续。</text>
