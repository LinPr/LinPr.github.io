<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" width="980" height="800" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="980" height="800" fill="#ffffff"/>
  <text x="490.0" y="32.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">Evaluator.Preempt：从「所有节点都失败」到「提名一个节点」</text>
  <text x="490.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">左列是主路径，右列是各步的提前退出；返回值决定 nominatedNodeName 保持、清空还是更新</text>
  <rect x="40" y="84" width="520" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="107.5" font-size="13" fill="#2563eb" font-weight="700">① 取最新的 Pod</text>
  <text x="52.0" y="125.5" font-size="12" fill="#334155">PodLister.Get：PostFilter 拿到的 pod 可能已过时</text>
  <rect x="40" y="160" width="520" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="185.6" font-size="13" fill="#2563eb" font-weight="700">② PodEligibleToPreemptOthers</text>
  <text x="52.0" y="203.6" font-size="12" fill="#334155">preemptionPolicy=Never → 不抢占</text>
  <text x="52.0" y="221.6" font-size="12" fill="#334155">提名节点上还有「被抢占、正在终止」的低优先级 Pod → 等</text>
  <line x1="300.0" y1="140" x2="300.0" y2="156" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="610" y="167.0" width="340" height="64" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="780.0" y="194.4" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">&lt;nil, Unschedulable&gt;</text>
  <text x="780.0" y="212.4" font-size="12" fill="#334155" text-anchor="middle">NNN 保持不变，等受害者退出</text>
  <line x1="560" y1="199.0" x2="606" y2="199.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="40" y="262" width="520" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="287.6" font-size="13" fill="#2563eb" font-weight="700">③ findCandidates：潜在节点</text>
  <text x="52.0" y="305.6" font-size="12" fill="#334155">NodesForStatusCode(…, Unschedulable)</text>
  <text x="52.0" y="323.6" font-size="12" fill="#334155">UnschedulableAndUnresolvable 的节点直接排除</text>
  <line x1="300.0" y1="238" x2="300.0" y2="258" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="610" y="269.0" width="340" height="64" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="780.0" y="296.4" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">&lt;NNN=&quot;&quot;, Unschedulable&gt;</text>
  <text x="780.0" y="314.4" font-size="12" fill="#334155" text-anchor="middle">「Preemption is not helpful」，清空 NNN</text>
  <line x1="560" y1="301.0" x2="606" y2="301.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="40" y="364" width="520" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="385.6" font-size="13" fill="#2563eb" font-weight="700">④ GetOffsetAndNumCandidates</text>
  <text x="52.0" y="403.6" font-size="12" fill="#334155">offset = rand(N)</text>
  <text x="52.0" y="421.6" font-size="12" fill="#334155">num = min(N, max(N×pct/100, absolute))</text>
  <line x1="300.0" y1="340" x2="300.0" y2="360" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="452" width="520" height="98" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="478.6" font-size="13" fill="#2563eb" font-weight="700">⑤ DryRunPreemption（并行）</text>
  <text x="52.0" y="496.6" font-size="12" fill="#334155">每个节点：GetVictimsOnNode → SelectVictimsOnNode</text>
  <text x="52.0" y="514.5" font-size="12" fill="#334155">state.Clone() + nodeInfo.Snapshot()，互不干扰</text>
  <text x="52.0" y="532.5" font-size="12" fill="#334155">不违反 PDB 的候选 ≥1 且总数 ≥ num 时提前 cancel</text>
  <line x1="300.0" y1="434" x2="300.0" y2="448" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="610" y="469.0" width="340" height="64" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="780.0" y="496.4" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">&lt;NNN=&quot;&quot;, Unschedulable&gt;</text>
  <text x="780.0" y="514.4" font-size="12" fill="#334155" text-anchor="middle">没有任何候选：同上，清空 NNN</text>
  <line x1="560" y1="501.0" x2="606" y2="501.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="40" y="572" width="520" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="597.5" font-size="13" fill="#2563eb" font-weight="700">⑥ callExtenders → ⑦ SelectCandidate</text>
  <text x="52.0" y="615.5" font-size="12" fill="#334155">支持抢占的 extender 可删改受害者</text>
  <text x="52.0" y="633.5" font-size="12" fill="#334155">pickOneNodeForPreemption：多级规则逐级淘汰</text>
  <line x1="300.0" y1="550" x2="300.0" y2="568" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="40" y="672" width="520" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="52.0" y="697.5" font-size="13" fill="#2563eb" font-weight="700">⑧ Executor.ActuatePodPreemption</text>
  <text x="52.0" y="715.5" font-size="12" fill="#334155">SchedulerAsyncPreemption 开：起 goroutine 立即返回</text>
  <text x="52.0" y="733.5" font-size="12" fill="#334155">关：同步删除受害者、清理低优先级 NNN</text>
  <line x1="300.0" y1="650" x2="300.0" y2="668" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="610" y="674.0" width="340" height="74" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="780.0" y="697.4" font-size="12.5" fill="#059669" font-weight="700" text-anchor="middle">&lt;NNN=node, Success&gt;</text>
  <text x="780.0" y="715.4" font-size="12" fill="#334155" text-anchor="middle">handleSchedulingFailure 写 NNN，</text>
  <text x="780.0" y="733.4" font-size="12" fill="#334155" text-anchor="middle">Pod 回队列等下一轮</text>
  <line x1="560" y1="711.0" x2="606" y2="711.0" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
</svg>
