<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ea580c"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2563eb"/></marker></defs>
<rect width="1000" height="650" fill="#ffffff"/>
<text x="500.0" y="34.0" font-size="19" fill="#1e293b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">TaintToleration：同一组污点，按 effect 分给 Filter 和 Score</text>
<text x="500.0" y="58.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Filter 只看 NoSchedule / NoExecute，命中一个不被容忍的就淘汰节点；Score 只数 PreferNoSchedule 中不被容忍的个数，越多越差</text>
<rect x="300.0" y="80.0" width="400.0" height="96.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="500.0" y="106.8" font-size="13.5" fill="#1e293b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">Node.spec.taints（示例）</text>
<text x="500.0" y="124.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">dedicated=gpu:NoSchedule</text>
<text x="500.0" y="142.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node.kubernetes.io/not-ready:NoExecute</text>
<text x="500.0" y="159.5" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">spot=true:PreferNoSchedule</text>
<polyline points="380.0,176.0 250.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="620.0,176.0 750.0,214.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="216.0" width="380.0" height="66.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="250.0" y="236.3" font-size="13" fill="#2563eb" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">Filter：DoNotScheduleTaintsFilterFunc</text>
<text x="250.0" y="254.0" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">只保留 effect 为 NoSchedule 或 NoExecute 的污点</text>
<text x="250.0" y="271.4" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">PreferNoSchedule 在这里被丢掉</text>
<polyline points="250.0,282.0 250.0,304.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60.0" y="306.0" width="380.0" height="76.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="250.0" y="331.3" font-size="13" fill="#2563eb" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">FindMatchingUntoleratedTaint</text>
<text x="250.0" y="349.0" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">逐个污点：Pod 的任一 toleration ToleratesTaint 即算容忍</text>
<text x="250.0" y="366.4" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">返回第一个不被容忍的污点</text>
<polyline points="250.0,382.0 250.0,404.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150.0" y="406.0" width="200.0" height="44.0" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="250.0" y="432.7" font-size="13" fill="#1e293b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">存在不被容忍的污点？</text>
<polyline points="150.0,428.0 110.0,428.0 110.0,470.0" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<polyline points="350.0,428.0 390.0,428.0 390.0,470.0" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="116.0" y="408.6" width="20.0" height="16.2" fill="#ffffff" opacity="0.92"/>
<text x="126.0" y="420.0" font-size="12" fill="#dc2626" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">是</text>
<rect x="362.0" y="408.6" width="20.0" height="16.2" fill="#ffffff" opacity="0.92"/>
<text x="372.0" y="420.0" font-size="12" fill="#059669" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">否</text>
<rect x="20.0" y="472.0" width="230.0" height="66.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="135.0" y="492.5" font-size="11.5" fill="#dc2626" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">UnschedulableAndUnresolvable</text>
<text x="135.0" y="509.1" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">node(s) had untolerated</text>
<text x="135.0" y="525.8" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">taint(s)</text>
<rect x="290.0" y="472.0" width="170.0" height="66.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="375.0" y="501.2" font-size="13.5" fill="#059669" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">Success</text>
<text x="375.0" y="519.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">节点进入 Score</text>
<rect x="560.0" y="216.0" width="400.0" height="66.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="760.0" y="236.5" font-size="12.5" fill="#0d9488" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">PreScore：getAllTolerationPreferNoSchedule</text>
<text x="760.0" y="254.0" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">只留下 effect 为空或 PreferNoSchedule 的 toleration</text>
<text x="760.0" y="270.9" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">写入 CycleState[&quot;PreScoreTaintToleration&quot;]</text>
<polyline points="760.0,282.0 760.0,304.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560.0" y="306.0" width="400.0" height="76.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="760.0" y="330.9" font-size="12" fill="#0d9488" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">Score：countIntolerableTaintsPreferNoSchedule</text>
<text x="760.0" y="348.3" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">只数 effect == PreferNoSchedule 的污点里</text>
<text x="760.0" y="365.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不被上述 toleration 容忍的个数 → 原始分（越大越差）</text>
<polyline points="760.0,382.0 760.0,404.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560.0" y="406.0" width="400.0" height="62.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="760.0" y="432.4" font-size="11.5" fill="#0d9488" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">NormalizeScore：DefaultNormalizeScore(100, true)</text>
<text x="760.0" y="449.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">score = 100 − 100 × raw / max(raw)；max(raw)=0 时全部 100</text>
<polyline points="760.0,468.0 760.0,490.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="610.0" y="492.0" width="300.0" height="46.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
<text x="760.0" y="519.7" font-size="13" fill="#0d9488" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">× 默认权重 3 → 最终贡献 0~300</text>
<rect x="30.0" y="556.0" width="940.0" height="82.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="500.0" y="584.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">Toleration.ToleratesTaint 的匹配规则（staging/src/k8s.io/api/core/v1/toleration.go）</text>
<text x="500.0" y="601.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">① toleration.effect 非空时必须等于 taint.effect；② key 非空时必须相等，key 为空 + Exists 匹配一切；</text>
<text x="500.0" y="619.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">③ operator 为空或 Equal 比较 value，Exists 不看 value；④ Lt / Gt 做整数比较，需 TaintTolerationComparisonOperators（Alpha，默认关）</text>
</svg>