<text x="32.0" y="429.3" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  p1, p2 := e1.GetPriority(), e2.GetPriority()</text>
<text x="32.0" y="446.7" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  return (p1 &gt; p2) || (p1 == p2 &amp;&amp;</text>
<text x="32.0" y="464.1" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    e1.GetTimestamp().Before(e2.GetTimestamp()))</text>
<text x="32.0" y="481.5" font-size="12" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">}</text>
