<rect x="20.0" y="520.0" width="940.0" height="84.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="490.0" y="548.9" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Timestamp 何时变化：新 Pod 入队（newQueuedPodInfo）设为当前时间；调度失败回队（AddUnschedulablePodIfNotPresent）刷新；</text>
<text x="490.0" y="566.3" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">在 unschedulableEntities / backoffQ / activeQ 之间移动、Pod 被更新、gate 被删除时都不变。</text>
<text x="490.0" y="583.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">backoffQ 先按退避到期时间（对齐到 1s 窗口）排序，同一窗口内也调用这个 Less，所以 PrioritySort 同时影响 backoffQ 的出队顺序。</text>
