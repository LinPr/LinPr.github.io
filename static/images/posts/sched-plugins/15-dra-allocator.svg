<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="940" height="470" fill="#ffffff"/>
  <text x="470.0" y="32.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">allocator 的回溯搜索：第一个完整解即返回</text>
  <text x="470.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">claim 要 2 块 GPU 且 matchAttribute: pcieRoot 相同；节点上依次是 gpu0(A) gpu1(B) gpu2(B)（incubating 实现）</text>
  <rect x="400" y="80" width="140" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="470.0" y="98.7" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle">allocateOne</text>
  <text x="470.0" y="113.7" font-size="11" fill="#334155" text-anchor="middle">claim0/req0/dev0</text>
  <rect x="70" y="170" width="200" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="170.0" y="191.4" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">试 gpu0</text>
  <text x="170.0" y="207.4" font-size="11" fill="#334155" text-anchor="middle">pcieRoot=A，约束集合={A}</text>
  <line x1="470" y1="124" x2="170" y2="166" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="370" y="170" width="200" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="470.0" y="191.4" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">试 gpu1</text>
  <text x="470.0" y="207.4" font-size="11" fill="#334155" text-anchor="middle">pcieRoot=B，约束集合={B}</text>
  <line x1="470" y1="124" x2="470" y2="166" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="670" y="170" width="200" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="770.0" y="191.4" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">gpu2</text>
  <text x="770.0" y="207.4" font-size="11" fill="#334155" text-anchor="middle">不会走到这里</text>
  <line x1="470" y1="124" x2="770" y2="166" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="40" y="270" width="120" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="100.0" y="291.2" font-size="12" fill="#ea580c" font-weight="700" text-anchor="middle">dev1: gpu1</text>
  <text x="100.0" y="307.2" font-size="11" fill="#334155" text-anchor="middle">B≠A，add 失败</text>
  <rect x="180" y="270" width="120" height="50" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="240.0" y="291.2" font-size="12" fill="#ea580c" font-weight="700" text-anchor="middle">dev1: gpu2</text>
  <text x="240.0" y="307.2" font-size="11" fill="#334155" text-anchor="middle">B≠A，add 失败</text>
  <line x1="150" y1="220" x2="100" y2="266" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="190" y1="220" x2="240" y2="266" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="60" y="356" width="220" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="170.0" y="375.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">返回 false → deallocate(gpu0)</text>
  <text x="170.0" y="391.0" font-size="11" fill="#334155" text-anchor="middle">回到上一层换下一个设备</text>
  <line x1="170" y1="320" x2="170" y2="352" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="312" y="270" width="160" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="392.0" y="291.2" font-size="12" fill="#1e293b" font-weight="700" text-anchor="middle">不回头试 gpu0</text>
  <text x="392.0" y="307.2" font-size="11" fill="#334155" text-anchor="middle">startLocation 从 gpu1 之后</text>
  <rect x="490" y="270" width="120" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="550.0" y="291.2" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">dev1: gpu2</text>
  <text x="550.0" y="307.2" font-size="11" fill="#334155" text-anchor="middle">B=B，add 成功</text>
  <line x1="440" y1="220" x2="400" y2="266" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="490" y1="220" x2="550" y2="266" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="460" y="356" width="180" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="550.0" y="375.0" font-size="11.5" fill="#1e293b" font-weight="700" text-anchor="middle">dev2 ≥ numDevices</text>
  <text x="550.0" y="391.0" font-size="11" fill="#334155" text-anchor="middle">→ 下一个 request/claim</text>
  <line x1="550" y1="320" x2="550" y2="352" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="680" y="356" width="230" height="46" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="795.0" y="375.0" font-size="11.5" fill="#059669" font-weight="700" text-anchor="middle">claimIndex ≥ len(claims)</text>
  <text x="795.0" y="391.0" font-size="11" fill="#334155" text-anchor="middle">返回 true：{gpu1, gpu2}</text>
  <line x1="640" y1="379" x2="676" y2="379" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="470.0" y="440.0" font-size="11.5" fill="#64748b" text-anchor="middle">没有「比较多个解」的步骤：设备顺序 = pool 顺序 × slice 顺序 × slice 内顺序；firstAvailable 也按列表顺序逐个尝试子请求</text>
</svg>
