<text x="846.0" y="487.5" font-size="11.5" fill="#dc2626" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">UnschedulableAndUnresolvable</text>
<text x="846.0" y="504.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">抢占不会把它们当候选</text>
<rect x="476.0" y="534.0" width="488.0" height="76.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="720.0" y="559.8" font-size="12.5" fill="#ea580c" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">绕过 PreFilterResult 的路径：Filter 是最后防线</text>
<text x="720.0" y="576.9" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">evaluateNominatedNode 直接在 nominatedNodeName（或批处理 hint）</text>
<text x="720.0" y="593.5" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">上跑 Filter，不看 PreFilterResult；NodeName.Filter 再次比较节点名</text>
