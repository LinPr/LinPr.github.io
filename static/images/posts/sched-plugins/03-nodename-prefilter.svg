<text x="486.0" y="320.0" font-size="11.5" fill="#64748b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">nil（从不缩小范围）</text>
<text x="800.0" y="311.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">nil（全部节点）</text>
<rect x="476.0" y="332.0" width="488.0" height="52.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="486.0" y="353.0" font-size="12.5" fill="#059669" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">NodeAffinity</text>
<text x="486.0" y="372.0" font-size="11.5" fill="#64748b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">{n3}（matchFields: metadata.name In [n3]）</text>
<text x="800.0" y="363.0" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">{n3}</text>
<text x="486.0" y="404.0" font-size="11.5" fill="#64748b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">Pod 若写了 spec.nodeName=n3，则由 NodeName 返回 {n3}；多个插件都返回</text>
<text x="486.0" y="421.0" font-size="11.5" fill="#64748b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">集合时取交集，交集为空 → 本周期直接 UnschedulableAndUnresolvable。</text>
<polyline points="720.0,430.0 720.0,444.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="476.0" y="446.0" width="230.0" height="74.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
