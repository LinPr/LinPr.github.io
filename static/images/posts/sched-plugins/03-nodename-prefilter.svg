<text x="226.0" y="233.0" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">assignedPod(pod) 为真 → 只进缓存</text>
<text x="226.0" y="250.4" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">不进调度队列，NodeName 插件不会被调用</text>
<polyline points="226.0,260.0 226.0,282.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="56.0" y="284.0" width="340.0" height="84.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
