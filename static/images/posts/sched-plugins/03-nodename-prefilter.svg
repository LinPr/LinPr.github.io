<text x="486.0" y="268.0" font-size="11.5" fill="#64748b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">nil（spec.nodeName 为空）</text>
