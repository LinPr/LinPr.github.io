<text x="226.0" y="398.0" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">唯一的例外（feature gate 默认关闭）</text>
<rect x="56.0" y="410.0" width="340.0" height="92.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="226.0" y="434.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">InPlacePodVerticalScalingSchedulerPreemption</text>
<text x="226.0" y="451.3" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">已运行 Pod 的 resize 被 kubelet 推迟（Deferred）</text>
<text x="226.0" y="468.7" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">→ addPod / updatePod 把它放进调度队列</text>
<text x="226.0" y="486.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">目的：在原节点上评估能否通过抢占腾出资源</text>
