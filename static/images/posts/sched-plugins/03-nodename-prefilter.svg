<text x="226.0" y="546.3" font-size="13" fill="#059669" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">NodeName.PreFilter</text>
<text x="226.0" y="564.1" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">NodeNames = {spec.nodeName}</text>
<text x="226.0" y="580.9" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">NodeUnschedulable / TaintToleration /</text>
<text x="226.0" y="597.6" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">NodeAffinity 对这种 Pod 返回 Skip</text>
