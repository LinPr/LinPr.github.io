<text x="226.0" y="322.2" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">nodename.Fits / NodeAffinity / NodePorts</text>
<text x="226.0" y="339.4" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">资源是否放得下 / NoExecute 污点</text>
