<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="940" height="530" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="470.0" y="34" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="bold">NodeMetadata：字符串 → 原始分 → 归一化</text>
<text x="470.0" y="58" font-size="13" fill="#64748b" text-anchor="middle">metadataType=Number、scoringStrategy=Lowest，键为 node.example.com/hourly-cost（annotation）</text>
<rect x="30" y="84" width="880" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="106" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">节点</text>
<text x="150" y="106" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">annotation 值</text>
<text x="300" y="106" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">ParseFloat → int64</text>
<text x="480" y="106" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">原始分（Lowest 取负）</text>
<text x="700" y="106" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">归一化</text>
<rect x="30" y="128" width="880" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="151" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">node-a</text>
<text x="150" y="151" font-size="13.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">"2.5"</text>
<text x="300" y="151" font-size="13.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2</text>
<text x="480" y="151" font-size="13.5" fill="#334155" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">−2</text>
<rect x="700" y="137" width="120" height="18" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="700" y="137" width="1.2" height="18" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="830" y="151" font-size="13.5" fill="#2563eb" text-anchor="start" font-weight="bold">1</text>
<rect x="30" y="172" width="880" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
