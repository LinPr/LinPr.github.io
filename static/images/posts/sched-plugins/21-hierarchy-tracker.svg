<rect x="30.0" y="436.0" width="920.0" height="104.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
<text x="40.0" y="466.6" font-size="13" fill="#1e293b" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">几个只有读代码才看得到的细节</text>
<text x="40.0" y="484.3" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">· Pod 先于 PodGroup 到达时，getOrCreateGroup 先建占位节点，minCount 默认 1；PodGroup 对象到达后再用真实值重算并补传播。</text>
<text x="40.0" y="501.7" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">· ps 的 minCount=1 却未就绪：它一个 Pod 都没有。根组只要求 2 个子组就绪，ps 不就绪也不影响放行（minGroupCount 不是「全部」）。</text>
<text x="40.0" y="519.1" font-size="12" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">· 不开 CompositePodGroup 时 parentKey 被忽略，每个 PodGroup 自己就是根；PreEnqueue 退化为「本组 Pod 总数 ≥ minCount」。</text>
</svg>