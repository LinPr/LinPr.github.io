<text x="460.0" y="181.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6</text>
<text x="648.0" y="181.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6</text>
<text x="836.0" y="181.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4（够 minCount）</text>
<rect x="30.0" y="192.0" width="900.0" height="30.0" rx="0" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="42.0" y="212.0" font-size="13" fill="#0d9488" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">PodGroupPodsCount（权重 1）</text>
<rect x="30.0" y="222.0" width="900.0" height="32.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="42.0" y="243.0" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">ScorePlacement = 已调度 0 + 提议数</text>
<text x="460.0" y="243.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6</text>
<text x="648.0" y="243.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6</text>
<text x="836.0" y="243.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4</text>
