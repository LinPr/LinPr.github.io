<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#059669"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ea580c"/></marker><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#2563eb"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="490.0" y="34.0" font-size="19" fill="#1e293b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">PlacementScore 算例：3 个可行 rack，选哪一个</text>
<text x="490.0" y="58.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">gang.minCount = 4，队列里 6 个 Pod，每个请求 8 CPU / 32Gi；每个 rack 4 个节点，合计 128 CPU / 512Gi</text>
<rect x="30.0" y="92.0" width="900.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="42.0" y="115.0" font-size="13" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="460.0" y="116.0" font-size="14" fill="#2563eb" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">rack-a</text>
<text x="648.0" y="116.0" font-size="14" fill="#7c3aed" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">rack-b</text>
<text x="836.0" y="116.0" font-size="14" fill="#0d9488" text-anchor="middle" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">rack-c</text>
<rect x="30.0" y="128.0" width="900.0" height="32.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="42.0" y="149.0" font-size="12.5" fill="#334155" text-anchor="start" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">rack 内已占用（CPU / 内存）</text>
<text x="460.0" y="149.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">72 / 256Gi</text>
<text x="648.0" y="149.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">16 / 64Gi</text>
<text x="836.0" y="149.0" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">96 / 384Gi</text>
<rect x="30.0" y="160.0" width="900.0" height="32.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
