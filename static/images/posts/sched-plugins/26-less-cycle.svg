<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="940" height="380" fill="#ffffff"/>
  <text x="470.0" y="32" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">拼接出来的 Less：不传递，相等元素互判为「更小」</text>
  <text x="470.0" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">同 AppGroup 用 index、不同 AppGroup 用优先级；三个 Pod 可以互相「排在前面」</text>
  <rect x="40" y="90" width="220" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="54" y="114" font-size="14" fill="#334155" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">A  shop/frontend</text>
  <text x="54" y="134" font-size="12" fill="#475569">AppGroup shop，index 1</text>
  <text x="54" y="151" font-size="12" fill="#475569">priority 0</text>
  <rect x="420" y="90" width="220" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="434" y="114" font-size="14" fill="#334155" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">C  shop/redis</text>
  <text x="434" y="134" font-size="12" fill="#475569">AppGroup shop，index 4</text>
  <text x="434" y="151" font-size="12" fill="#475569">priority 1000</text>
  <rect x="230" y="270" width="220" height="70" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="244" y="294" font-size="14" fill="#334155" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">B  batch-job</text>
  <text x="244" y="314" font-size="12" fill="#475569">没有 AppGroup label</text>
  <text x="244" y="331" font-size="12" fill="#475569">priority 500</text>
  <line x1="260" y1="125" x2="414" y2="125" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="337" y="112" font-size="12" fill="#5b21b6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(A, C) = true</text>
  <text x="337" y="146" font-size="12" fill="#64748b" text-anchor="middle">同组：1 &lt;= 4</text>
  <line x1="500" y1="160" x2="420" y2="266" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="470" y="222" font-size="12" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(C, B) = true</text>
  <text x="470" y="240" font-size="12" fill="#64748b">不同组：1000 &gt; 500</text>
  <line x1="236" y1="268" x2="140" y2="164" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="40" y="222" font-size="12" fill="#1d4ed8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(B, A) = true</text>
  <text x="40" y="240" font-size="12" fill="#64748b">不同组：500 &gt; 0</text>
  <text x="150" y="362" font-size="12.5" fill="#64748b">箭头 X → Y 表示 Less(X, Y) 为 true，即 X 应排在 Y 前面；A → C → B → A 成环</text>
  <rect x="680" y="84" width="236" height="252" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="694" y="108" font-size="13.5" fill="#c2410c" font-weight="700">同 index 的两个 Pod</text>
  <text x="694" y="132" font-size="12.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cart-0 与 cart-1：</text>
  <text x="694" y="152" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(cart-0, cart-1) = true</text>
  <text x="694" y="170" font-size="11.5" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(cart-1, cart-0) = true</text>
  <text x="694" y="196" font-size="12.5" fill="#334155">&lt;= 让相等元素互判为「更小」，</text>
  <text x="694" y="216" font-size="12.5" fill="#334155">堆上浮时新元素会越过同 index</text>
  <text x="694" y="236" font-size="12.5" fill="#334155">的父节点；同组内既不看优先级，</text>
  <text x="694" y="256" font-size="12.5" fill="#334155">也不看入队时间</text>
  <text x="694" y="288" font-size="12.5" fill="#9a3412" font-weight="700">结果：出队顺序依赖插入顺序</text>
  <text x="694" y="308" font-size="12.5" fill="#9a3412" font-weight="700">和堆形状，不再可预测</text>
</svg>
