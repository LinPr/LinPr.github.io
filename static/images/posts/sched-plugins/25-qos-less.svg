  <text x="828" y="214" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">t5</text>
  <text x="514" y="236" font-size="13" fill="#334155" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">f</text>
  <text x="588" y="236" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0</text>
  <text x="680" y="236" font-size="13" fill="#059669">Guaranteed</text>
  <text x="828" y="236" font-size="13" fill="#334155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">t6</text>
  <text x="510" y="264" font-size="11.5" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">t1 &lt; t2 &lt; … &lt; t6</text>
