<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2563eb"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="940" height="450" fill="#ffffff"/>
  <text x="470.0" y="32" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">QOSSort.Less：在 PrioritySort 的两级比较中间插入 QoS</text>
  <text x="470.0" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">左：一次比较的三级判定；右：同一批 Pod 在两种排序下的出队顺序（假设出队期间没有新 Pod 进来）</text>
  <rect x="24" y="76" width="236" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="142" y="98" font-size="12.5" fill="#334155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Less(pInfo1, pInfo2)</text>
  <rect x="24" y="132" width="236" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="36" y="153" font-size="13" fill="#1e3a8a" font-weight="700">① 优先级不同？</text>
  <text x="36" y="172" font-size="11.5" fill="#475569">PodPriority：spec.priority，nil 取 0</text>
  <line x1="142" y1="184" x2="142" y2="210" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="150" y="202" font-size="12" fill="#64748b">否</text>
  <line x1="260" y1="158.0" x2="286" y2="158.0" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="290" y="143.0" width="172" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="300" y="163.0" font-size="12" fill="#065f46">是 → return p1 &gt; p2</text>
  <rect x="24" y="214" width="236" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="36" y="235" font-size="13" fill="#1e3a8a" font-weight="700">② QoS 等级不同？</text>
  <text x="36" y="254" font-size="11.5" fill="#475569">Guaranteed &gt; Burstable &gt; BestEffort</text>
  <line x1="142" y1="266" x2="142" y2="292" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="150" y="284" font-size="12" fill="#64748b">否</text>
  <line x1="260" y1="240.0" x2="286" y2="240.0" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="290" y="225.0" width="172" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="300" y="245.0" font-size="12" fill="#065f46">是 → return 等级高者</text>
  <rect x="24" y="296" width="236" height="52" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/>
  <text x="36" y="317" font-size="13" fill="#115e59" font-weight="700">③ 优先级、QoS 都相同</text>
  <text x="36" y="336" font-size="11.5" fill="#475569">比较入队时间 Timestamp，早者在前</text>
  <line x1="142" y1="110" x2="142" y2="128" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="24" y="366" width="438" height="58" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="36" y="388" font-size="12" fill="#475569">GetPodQOS 先读 status.qosClass（apiserver 创建 Pod 时写入），</text>
  <text x="36" y="408" font-size="12" fill="#475569">为空才现场 ComputePodQOS；扩展资源、非 cpu/memory 不参与判定</text>
  <rect x="490" y="76" width="426" height="196" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
