<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 z" fill="#94a3b8"/></marker></defs>
<text x="480.0" y="34.0" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">算例：容忍期到期与重试时机</text>
<text x="480.0" y="58.0" font-size="13" fill="#64748b" text-anchor="middle">victim 的 PriorityClass：value 8000，minimum-preemptable-priority 10000，toleration-seconds 600</text>
<text x="30.0" y="128.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">victim</text>
<text x="30.0" y="146.0" font-size="12" fill="#64748b" text-anchor="start">value 8000</text>
<text x="30.0" y="228.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">P1</text>
<text x="30.0" y="246.0" font-size="12" fill="#64748b" text-anchor="start">priority 9000</text>
<rect x="190.0" y="112.0" width="456.2" height="36.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="418.1" y="135.0" font-size="12.5" fill="#059669" text-anchor="middle">容忍期：对 9000 豁免（scheduledAt + 600s &gt; now）</text>
<rect x="646.2" y="112.0" width="54.8" height="36.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="673.6" y="135.0" font-size="12.5" fill="#ea580c" text-anchor="middle">可抢</text>
<rect x="701.0" y="112.0" width="219.0" height="36.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="810.5" y="135.0" font-size="12.5" fill="#dc2626" text-anchor="middle">已被驱逐</text>
<rect x="463.8" y="212.0" width="228.1" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="577.8" y="235.0" font-size="12.5" fill="#64748b" text-anchor="middle">unschedulablePods：没有事件唤醒</text>
<rect x="691.9" y="212.0" width="228.1" height="36.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="805.9" y="235.0" font-size="12.5" fill="#2563eb" text-anchor="middle">nominated → 等 victim 退出后绑定</text>
<line x1="463.8" y1="196.0" x2="463.8" y2="210.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="691.9" y1="196.0" x2="691.9" y2="210.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
<text x="463.8" y="188.0" font-size="12" fill="#ea580c" text-anchor="middle">t=6 P1 失败：victim 豁免 → 无候选</text>
<text x="697.9" y="188.0" font-size="12" fill="#2563eb" text-anchor="start">t≈11 被刷回队列，重试后抢占</text>
<line x1="646.2" y1="104.0" x2="646.2" y2="160.0" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="646.2" y1="254.0" x2="646.2" y2="300.0" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="646.2" y="98.0" font-size="12" fill="#dc2626" text-anchor="middle">t=10 容忍期结束（无任何事件）</text>
<line x1="190.0" y1="300.0" x2="920.0" y2="300.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="190.0" y1="300.0" x2="190.0" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="190.0" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">0 min</text>
<line x1="281.2" y1="300.0" x2="281.2" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="281.2" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">2 min</text>
<line x1="372.5" y1="300.0" x2="372.5" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="372.5" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">4 min</text>
<line x1="463.8" y1="300.0" x2="463.8" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="463.8" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">6 min</text>
<line x1="555.0" y1="300.0" x2="555.0" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="555.0" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">8 min</text>
<line x1="646.2" y1="300.0" x2="646.2" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="646.2" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">10 min</text>
<line x1="737.5" y1="300.0" x2="737.5" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="737.5" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">12 min</text>
<line x1="828.8" y1="300.0" x2="828.8" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="828.8" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">14 min</text>
<line x1="920.0" y1="300.0" x2="920.0" y2="306.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="920.0" y="322.0" font-size="12" fill="#64748b" text-anchor="middle">16 min</text>
<text x="190.0" y="104.0" font-size="12" fill="#059669" text-anchor="start">t=0 PodScheduled=True</text>
<rect x="30.0" y="346.0" width="440.0" height="66.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
<text x="42.0" y="365.4" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700">重试延迟：容忍期到期本身不产生集群事件</text>
<text x="42.0" y="383.7" font-size="12.5" fill="#334155" text-anchor="start">只能等其他事件，或 unschedulablePods 的 5 分钟超时</text>
<text x="42.0" y="401.8" font-size="12.5" fill="#334155" text-anchor="start">（每 30 秒检查一次），最坏约晚 5.5 分钟</text>
<rect x="490.0" y="346.0" width="440.0" height="66.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="502.0" y="365.4" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700">优先级 ≥ 10000 的抢占者</text>
<text x="502.0" y="383.7" font-size="12.5" fill="#334155" text-anchor="start">门槛检查即判不豁免：任何时刻都能抢占 victim</text>
<text x="502.0" y="401.8" font-size="12.5" fill="#334155" text-anchor="start">优先级 ≤ 8000 的 Pod 本来就不能抢它</text>
</svg>
