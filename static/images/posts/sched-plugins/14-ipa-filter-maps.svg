<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="ui-sans-serif,-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/></marker><marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#059669"/></marker><marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#ea580c"/></marker><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#dc2626"/></marker></defs>
  <rect width="960" height="690" fill="#ffffff"/>
  <text x="480.0" y="32.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">PreFilter 的三张拓扑计数表与 Filter 的三道检查</text>
  <text x="480.0" y="54.0" font-size="12.5" fill="#64748b" text-anchor="middle">新 Pod web：required 亲和 app=cache（zone）＋ required 反亲和 app=web（hostname）；示例按 gate 关闭的通用路径</text>
  <rect x="30.0" y="72.0" width="300.0" height="118.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="42.0" y="92.0" font-size="13" fill="#1e293b" font-weight="700">zone-a</text>
  <rect x="42.0" y="102.0" width="132.0" height="78.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="108.0" y="121.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">n1</text>
  <rect x="58.0" y="134.0" width="100.0" height="30.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="108.0" y="154.0" font-size="12.5" fill="#059669" font-weight="700" text-anchor="middle">cache-1</text>
  <rect x="186.0" y="102.0" width="132.0" height="78.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="252.0" y="121.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">n2</text>
  <rect x="202.0" y="134.0" width="100.0" height="30.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="252.0" y="154.0" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">web-1</text>
  <rect x="350.0" y="72.0" width="300.0" height="118.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="362.0" y="92.0" font-size="13" fill="#1e293b" font-weight="700">zone-b</text>
  <rect x="362.0" y="102.0" width="132.0" height="78.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="428.0" y="121.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">n3</text>
  <rect x="378.0" y="134.0" width="100.0" height="30.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="428.0" y="154.0" font-size="12.5" fill="#dc2626" font-weight="700" text-anchor="middle">batch-1*</text>
  <rect x="506.0" y="102.0" width="132.0" height="78.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="572.0" y="121.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">n4</text>
  <rect x="522.0" y="134.0" width="100.0" height="30.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="572.0" y="154.0" font-size="12.5" fill="#059669" font-weight="700" text-anchor="middle">cache-2</text>
  <rect x="670.0" y="72.0" width="260.0" height="118.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="682.0" y="92.0" font-size="13" fill="#1e293b" font-weight="700">zone-c</text>
  <rect x="682.0" y="102.0" width="132.0" height="78.0" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="748.0" y="121.0" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">n5</text>
  <text x="30.0" y="210.0" font-size="12.5" fill="#dc2626">* batch-1 带 required 反亲和：不允许 app=web 进入同一 zone（topologyKey=zone）</text>
  <rect x="30.0" y="228.0" width="288.0" height="108.0" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="174.0" y="252.0" font-size="11.5" fill="#059669" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">clusterWideAffinityCounts</text>
  <text x="174.0" y="276.0" font-size="12.5" fill="#334155" text-anchor="middle">新 Pod 亲和项匹配到的已有 Pod</text>
  <text x="174.0" y="310.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">{zone=a: 1,  zone=b: 1}</text>
  <rect x="336.0" y="228.0" width="288.0" height="108.0" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="480.0" y="252.0" font-size="11.5" fill="#ea580c" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">clusterWideAntiAffinityCounts</text>
  <text x="480.0" y="276.0" font-size="12.5" fill="#334155" text-anchor="middle">新 Pod 反亲和项匹配到的已有 Pod</text>
  <text x="480.0" y="310.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">{hostname=n2: 1}</text>
  <rect x="642.0" y="228.0" width="288.0" height="108.0" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="786.0" y="252.0" font-size="11.5" fill="#dc2626" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">existingClusterWideAntiAffinityCounts</text>
  <text x="786.0" y="276.0" font-size="12.5" fill="#334155" text-anchor="middle">已有 Pod 的反亲和项匹配到新 Pod</text>
  <text x="786.0" y="310.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">{zone=b: 1}</text>
  <text x="480.0" y="356.0" font-size="12.5" fill="#64748b" text-anchor="middle">键是 topologyPair{key, value}；三张表都在 PreFilter 中并行遍历节点后合并，Filter 只查表</text>
  <text x="30.0" y="390.0" font-size="14" fill="#1e293b" font-weight="700">Filter 的检查顺序（遇到第一个失败就返回）</text>
  <rect x="30.0" y="404.0" width="900.0" height="32.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60.0" y="425.0" font-size="13" fill="#1e293b" font-weight="700" text-anchor="middle">节点</text>
  <text x="185.0" y="425.0" font-size="13" fill="#1e293b" font-weight="700" text-anchor="middle">① 新 Pod 亲和</text>
  <text x="375.0" y="425.0" font-size="13" fill="#1e293b" font-weight="700" text-anchor="middle">② 新 Pod 反亲和</text>
  <text x="565.0" y="425.0" font-size="13" fill="#1e293b" font-weight="700" text-anchor="middle">③ 已有 Pod 反亲和</text>
  <text x="795.0" y="425.0" font-size="13" fill="#1e293b" font-weight="700" text-anchor="middle">结果</text>
  <rect x="30.0" y="442.0" width="900.0" height="30.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60.0" y="462.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">n1</text>
  <text x="185.0" y="462.0" font-size="12.5" fill="#1e293b" text-anchor="middle">zone=a: 1 ✓</text>
  <text x="375.0" y="462.0" font-size="12.5" fill="#1e293b" text-anchor="middle">hostname=n1: 0 ✓</text>
  <text x="565.0" y="462.0" font-size="12.5" fill="#1e293b" text-anchor="middle">zone=a: 0 ✓</text>
  <text x="795.0" y="462.0" font-size="12.5" fill="#059669" font-weight="700" text-anchor="middle">通过</text>
  <rect x="30.0" y="478.0" width="900.0" height="30.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="60.0" y="498.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">n2</text>
  <text x="185.0" y="498.0" font-size="12.5" fill="#1e293b" text-anchor="middle">zone=a: 1 ✓</text>
  <text x="375.0" y="498.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">hostname=n2: 1 ✗</text>
  <text x="565.0" y="498.0" font-size="12.5" fill="#1e293b" text-anchor="middle">—</text>
  <text x="795.0" y="498.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">Unschedulable</text>
  <rect x="30.0" y="514.0" width="900.0" height="30.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="60.0" y="534.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">n3</text>
  <text x="185.0" y="534.0" font-size="12.5" fill="#1e293b" text-anchor="middle">zone=b: 1 ✓</text>
  <text x="375.0" y="534.0" font-size="12.5" fill="#1e293b" text-anchor="middle">hostname=n3: 0 ✓</text>
  <text x="565.0" y="534.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">zone=b: 1 ✗</text>
  <text x="795.0" y="534.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">Unschedulable</text>
  <rect x="30.0" y="550.0" width="900.0" height="30.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="60.0" y="570.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">n4</text>
  <text x="185.0" y="570.0" font-size="12.5" fill="#1e293b" text-anchor="middle">zone=b: 1 ✓</text>
  <text x="375.0" y="570.0" font-size="12.5" fill="#1e293b" text-anchor="middle">hostname=n4: 0 ✓</text>
  <text x="565.0" y="570.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">zone=b: 1 ✗</text>
  <text x="795.0" y="570.0" font-size="12.5" fill="#ea580c" font-weight="700" text-anchor="middle">Unschedulable</text>
  <rect x="30.0" y="586.0" width="900.0" height="30.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="60.0" y="606.0" font-size="12.5" fill="#1e293b" font-weight="700" text-anchor="middle">n5</text>
  <text x="185.0" y="606.0" font-size="12.5" fill="#dc2626" font-weight="700" text-anchor="middle">zone=c: 0 ✗</text>
  <text x="375.0" y="606.0" font-size="12.5" fill="#1e293b" text-anchor="middle">—</text>
  <text x="565.0" y="606.0" font-size="12.5" fill="#1e293b" text-anchor="middle">—</text>
  <text x="795.0" y="606.0" font-size="12.5" fill="#dc2626" font-weight="700" text-anchor="middle">UnschedulableAndUnresolvable</text>
  <text x="480.0" y="634.0" font-size="12.5" fill="#64748b" text-anchor="middle">n2：驱逐 web-1 即可解决；n3：驱逐本节点上的 batch-1 可解决；n4：冲突来自 n3 上的 batch-1，</text>
  <text x="480.0" y="654.0" font-size="12.5" fill="#64748b" text-anchor="middle">在 n4 上驱逐 Pod 无济于事，抢占模拟会失败；n5：zone-c 里缺 cache，驱逐什么都补不出来</text>
</svg>
